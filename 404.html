<style>
:root{
  --paper:#FBFAF8; --paper-2:#F3EFE9; --panel:#FFFFFF;
  --ink:#0A0A0A; --ink-2:#141210; --muted:#57534E; --stone:#78716C; --faint:#A8A29E;
  --ember:#C15F3C; --ember-bright:#D97757; --ember-deep:#9A4A2E; --ember-tint:#F4E7DF;
  --line:#E7E3DD; --line-dark:rgba(255,255,255,.12);
  --display:'Inter Tight',ui-sans-serif,system-ui,sans-serif;
  --body:'Inter',ui-sans-serif,system-ui,sans-serif;
  --serif:'Fraunces',Georgia,serif;
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:400;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-top:66px}
html{scroll-padding-top:80px}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px}
.narrow{max-width:760px;margin:0 auto}
a{color:inherit}
b,strong{font-weight:600}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px}

h1,h2,h3{font-family:var(--display);font-weight:300;letter-spacing:-.045em;line-height:.98;text-wrap:balance}
h2{font-size:clamp(40px,5.2vw,72px)}
h2 .w{font-weight:500}
h3{font-weight:400;font-size:clamp(22px,2.2vw,28px);letter-spacing:-.03em;line-height:1.1}
.center{text-align:center}
.center h2{margin-left:auto;margin-right:auto}
.lead{font-size:clamp(16.5px,1.6vw,18.5px);line-height:1.6;color:var(--muted);max-width:60ch;margin:22px auto 0}
.center .lead{margin-left:auto;margin-right:auto}
.label{font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember-deep);display:block;margin-bottom:18px}

/* kvadratiniai mygtukai - CAIS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--body);font-weight:500;font-size:14px;letter-spacing:-.005em;padding:14px 24px;border-radius:0;text-decoration:none;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);transition:background .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease),transform .15s var(--ease)}
.btn:hover{background:var(--ember);border-color:var(--ember);color:#fff}
.btn-ember{background:var(--ember);border-color:var(--ember);color:#fff;text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:600;padding:16px 26px}
.btn-ember:hover{background:var(--ember-bright);border-color:var(--ember-bright)}
.btn-line{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-line:hover{background:var(--ink);color:var(--paper)}
.on-dark .btn-line{color:var(--paper);border-color:rgba(255,255,255,.7)}
.on-dark .btn-line:hover{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.micro{font-size:13px;color:var(--stone)}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:60;background:rgba(10,10,10,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-dark);color:var(--paper)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;gap:20px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo .wm{font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:-.01em;line-height:1}
.logo .dot{color:var(--ember-bright)}
.nav-links{display:flex;gap:28px;font-size:14px;font-weight:500}
.nav-links a{text-decoration:none;color:rgba(255,255,255,.82)}
.nav-links a:hover{color:#fff}
.nav .btn{background:var(--ember);color:#fff;border-color:var(--ember);padding:11px 18px;text-transform:uppercase;letter-spacing:.07em;font-size:12.5px;font-weight:600}
.nav .btn:hover{background:var(--ember-bright);border-color:var(--ember-bright);color:#fff}
.nav.light{background:rgba(251,250,248,.97);border-bottom-color:var(--line);color:var(--ink)}
.nav.light .nav-links a{color:var(--muted)}.nav.light .nav-links a:hover{color:var(--ink)}
.nav.light .btn{background:var(--ember);color:#fff;border-color:var(--ember)}
.nav.light .logo .dot{color:var(--ember)}

/* HERO - juodas, tinklelis, kreivė */
.hero{background:var(--ink);color:var(--paper);position:relative;overflow:hidden;min-height:min(92vh,900px);display:flex;align-items:flex-end}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:72px 72px;pointer-events:none}
.hero .wrap{position:relative;z-index:2;width:100%;padding-top:clamp(72px,9vw,120px);padding-bottom:0}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:end}
.hero-grid>div{min-width:0}
.hero h1{font-size:clamp(40px,5.2vw,74px);letter-spacing:-.05em;line-height:.96;max-width:17ch}
.hero h1 .acc{color:var(--ember-bright);text-shadow:0 0 28px rgba(217,119,87,.35)}
.hero .sub{font-size:clamp(16.5px,1.5vw,19px);line-height:1.6;color:rgba(255,255,255,.82);max-width:48ch;margin:clamp(28px,4vw,64px) 0 30px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.hero .micro{width:100%;color:rgba(255,255,255,.55);margin-top:4px}
.hero-foot{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line-dark);margin-top:36px;padding:16px 0 18px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:500}
/* kreivė */
.curve{position:relative;padding-bottom:0;align-self:end}
.curve svg{display:block;width:100%;height:auto}
.curve .here-t{font-family:var(--display);font-weight:400;font-size:25px;letter-spacing:-.02em}
.hero .wm-in{font-family:var(--serif);font-weight:600;font-size:1.12em;color:#fff;letter-spacing:-.01em}
.hero .wm-in .dot{color:var(--ember-bright)}
.wm-in.ink{font-family:var(--serif);font-weight:600;font-size:1.12em;color:var(--ink);letter-spacing:-.01em}
.wm-in.ink .dot{color:var(--ember)}
/* LOGO MARQUEE - bespalviai, judantys */
.logos-row{display:block;margin:44px 0 0}
.logos-row .lbl{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:500;margin-bottom:18px}
.logos-viewport{display:flex;gap:64px;overflow:hidden;width:100%;min-width:0;contain:inline-size;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.logos-track{display:flex;align-items:center;gap:64px;flex:none;width:max-content;animation:marquee 48s linear infinite}
.logos-row:hover .logos-track{animation-play-state:paused}
.logos-track img{height:30px;width:auto;max-width:150px;object-fit:contain;opacity:.55;filter:grayscale(1);display:block}
@keyframes marquee{to{transform:translateX(calc(-100% - 64px))}}
/* KOMANDA */
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:56px}
.team-5{grid-template-columns:repeat(5,1fr);gap:22px}
.person .li-link{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--ember-deep);text-decoration:none}
.person .li-link:hover{text-decoration:underline}
.person .li-todo{color:var(--faint)}
@media(max-width:1180px){.team-5{grid-template-columns:repeat(3,1fr)}}
.person .ava{width:100%;aspect-ratio:1;background:var(--paper-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:300;font-size:48px;letter-spacing:-.04em;color:var(--stone);margin-bottom:18px;background-size:cover;background-position:center 20%}
.person .ava::after{content:attr(data-i)}
.person .ava.photo::after{content:none}
.person h3{font-size:18px;font-weight:500;letter-spacing:-.02em}
.person .r{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ember-deep);font-weight:600;margin:4px 0 10px}
.person p{font-size:13.5px;color:var(--muted);line-height:1.5}
#komanda .stats{margin-top:64px}
@media(max-width:860px){.team,.team-5{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.team{grid-template-columns:1fr}}
/* PATIRTIES JUOSTA - social proof po hero (nebenaudojama) */
.cred{padding:clamp(48px,6vw,84px) 0;border-bottom:1px solid var(--line)}
.cred-lead{font-family:var(--display);font-weight:300;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.035em;line-height:1.15;max-width:26ch}
.cred .stats{margin-top:36px;border-top:none;padding-top:0}
.curve .src{display:block;margin-top:12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45)}

/* SEKCIJŲ ORAS - 152px kaip CAIS */
section{padding:clamp(80px,10.5vw,152px) 0}
section.dark{background:var(--ink);color:var(--paper)}
section.dark h2,section.dark h3{color:var(--paper)}
section.dark .lead{color:rgba(255,255,255,.7)}
section.dark .label{color:var(--ember-bright)}

/* STAT JUOSTA */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;border-top:1px solid var(--line);padding-top:36px;margin-top:64px}
.stat .n{font-family:var(--display);font-weight:300;font-size:clamp(40px,4.6vw,64px);letter-spacing:-.045em;line-height:1;color:var(--ink)}
.stat .n .u{color:var(--ember)}
.stat .l{font-size:14px;color:var(--muted);margin-top:10px;max-width:24ch;line-height:1.45}

/* ATVEJAI santrauka - 5 eilutės su viena plytele */
.mini{margin-top:56px;border-bottom:1px solid var(--line)}
.mini-row{display:grid;grid-template-columns:44px 1fr auto;gap:36px;align-items:start;padding:32px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit;transition:background .2s var(--ease)}
.mini-row:hover .txt b{color:var(--ember-deep)}
.mini-row .no{font-family:var(--body);font-size:12px;letter-spacing:.1em;color:var(--ember);font-weight:500;font-variant-numeric:tabular-nums;align-self:start;padding-top:8px}
.mini-row.soon .no{color:var(--faint)}
.mini-row .txt b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(19px,1.9vw,24px);letter-spacing:-.03em;line-height:1.15;transition:color .2s var(--ease)}
.mini-row .txt .who-line{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin-top:8px}
.mini-row .txt .who-line img{width:28px;height:28px;border-radius:50%;object-fit:cover;filter:grayscale(1)}
.mini-row .txt .who-line b{display:inline;font-family:var(--body);font-weight:600;font-size:13.5px;letter-spacing:0;line-height:1.4;color:var(--ink)}
.mini-row .txt .who-line .li{color:var(--ember-deep);font-weight:600;cursor:pointer}
.mini-row .txt .who-line .li:hover{text-decoration:underline}
.mini-row .txt .bp{display:grid;grid-template-columns:44px 1fr;gap:14px;color:var(--muted);font-size:15px;margin-top:10px;max-width:70ch;line-height:1.5}
.mini-row .txt .bp em{font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--stone);padding-top:4px}
.mini-row .txt .bp.po{color:var(--ink);font-weight:500}
.mini-row .txt .bp.po em{color:var(--ember-deep)}
.mini-row .txt .more{display:inline-block;margin-top:12px;font-size:13.5px;font-weight:600;color:var(--ember-deep)}
.mini-row .tile-sub{display:block;font-family:var(--body);font-size:12.5px;color:var(--muted);margin-top:12px;letter-spacing:0;white-space:normal;max-width:22ch;margin-left:auto;line-height:1.45}
.mini-row .tile{font-family:var(--display);font-weight:300;font-size:clamp(30px,3vw,42px);letter-spacing:-.045em;line-height:1;text-align:right;min-width:200px;white-space:nowrap;padding-top:4px}
.mini-row .tile i{font-style:normal;color:var(--ember);font-size:.5em;letter-spacing:-.02em}
.mini-row .tile small{display:block;font-family:var(--body);font-size:12px;color:var(--stone);margin-top:8px;letter-spacing:0;white-space:normal;max-width:18ch;margin-left:auto}
.mini-cta{margin-top:32px}
.stats-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:860px){.mini-row{grid-template-columns:32px 1fr;gap:10px 16px}.mini-row .tile{grid-column:2;text-align:left;min-width:0}.mini-row .tile small,.mini-row .tile-sub{margin-left:0}.stats-3{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.stats-3{grid-template-columns:1fr}}
/* ATVEJAI - rail + Prieš/Po kortelė (naudojama krei-istorijos puslapyje) */
.cases-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;margin-top:56px;align-items:start}
.case-rail{display:flex;flex-direction:column;border-top:1px solid var(--line);position:sticky;top:90px;align-self:start}
.case-rail button{display:grid;grid-template-columns:36px 1fr auto;gap:18px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-left:2px solid transparent;padding:26px 8px 26px 14px;font-family:var(--display);font-weight:300;font-size:clamp(20px,2vw,27px);letter-spacing:-.03em;color:var(--stone);cursor:pointer;transition:color .2s var(--ease),border-color .2s var(--ease)}
.case-rail button .no{font-family:var(--body);font-size:12px;letter-spacing:.1em;font-weight:500;font-variant-numeric:tabular-nums}
.case-rail button .arr{opacity:0;color:var(--ember);font-family:var(--body);font-size:18px;transition:opacity .2s var(--ease)}
.case-rail button:hover:not(:disabled){color:var(--ink)}
.case-rail button.on{color:var(--ember-deep);border-left-color:var(--ember);font-weight:400}
.case-rail button.on .arr{opacity:1}
.case-rail button:disabled{cursor:default;color:var(--faint)}
.case-panel{position:relative}
.case{display:none;position:relative;background:var(--panel);border:1px solid var(--line);padding:clamp(28px,3.5vw,48px);overflow:hidden;background-image:linear-gradient(rgba(10,10,10,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(10,10,10,.04) 1px,transparent 1px);background-size:56px 56px;background-position:-1px -1px}
.case.on{display:block}
.case-tag{font-size:13.5px;font-weight:500;color:var(--stone);letter-spacing:.01em;display:flex;align-items:center;gap:10px;margin-bottom:26px}
.case-tag .dot{width:8px;height:8px;background:var(--ember);flex:none}
.ba{padding:0 0 26px}
.ba+.ba{border-top:1px solid var(--line);padding-top:26px}
.pill{display:inline-block;font-family:var(--body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--stone);background:var(--paper-2);padding:7px 12px;margin-bottom:14px}
.pill.po{color:var(--ember-deep);background:var(--ember-tint)}
.ba p{font-size:clamp(16px,1.5vw,18.5px);line-height:1.55;color:var(--muted);max-width:60ch}
.ba p.after{color:var(--ink);font-weight:500}
.case-stats{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:24px 0;margin-top:6px}
.case-stats b{display:block;font-family:var(--display);font-weight:300;font-size:clamp(34px,3.6vw,48px);letter-spacing:-.045em;line-height:1;color:var(--ink)}
.case-stats b .u{color:var(--ember);font-size:.5em;letter-spacing:-.02em}
.case-stats>div>span{display:block;font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.4;max-width:26ch}
.case-stats b .u{display:inline}
.essence{font-family:var(--display);font-weight:400;font-size:clamp(18px,1.8vw,22px);letter-spacing:-.025em;line-height:1.3;color:var(--ink);margin:26px 0;max-width:46ch}
.mock{border:1px solid var(--line);background:var(--paper);box-shadow:0 12px 40px rgba(10,10,10,.06);margin-top:8px}
.mock-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14.5px}
.mock-head b{font-weight:600;color:var(--ink)}
.mock-ic{width:14px;height:14px;background:var(--ember);flex:none}
.mock-src{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);font-weight:500}
.mock-chip{margin-left:auto;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ember-deep);background:var(--ember-tint);padding:6px 10px}
.bars{padding:10px 18px 6px}
.bar-row{display:grid;grid-template-columns:90px 1fr 56px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink)}
.bar-row:last-child{border-bottom:0}
.bar-row.hi{font-weight:600}
.bar-row .tr{display:flex;flex-direction:column;gap:4px}
.bar-row .tr i{display:block;height:10px;background:var(--ember)}
.bar-row .tr i.ly{height:6px;background:var(--line)}
.bar-row .k{text-align:right;font-variant-numeric:tabular-nums}
.mock-foot{padding:10px 18px 14px;font-size:12.5px;color:var(--stone)}
.case-tag .dot.soon{background:var(--faint)}
/* mock: chat */
.chat{padding:16px 18px 6px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 14px;font-size:14px;line-height:1.45;border:1px solid var(--line);background:var(--panel)}
.msg .who{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);font-weight:500;margin-bottom:4px}
.msg.out{align-self:flex-end;background:var(--ember-tint);border-color:transparent;color:var(--ink)}
.msg.sys{align-self:center;max-width:100%;border:0;background:none;font-size:12.5px;color:var(--ember-deep);font-weight:600;padding:4px 0}
/* mock: pirkėjo byla */
.kv{padding:6px 18px}
.kv-row{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
.kv-row:last-child{border-bottom:0}
.kv-row .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);font-weight:500;padding-top:3px}
.kv-row .v{color:var(--ink)}
/* mock: PDF pasiūlymas */
.doc{margin:14px 18px 6px;border:1px solid var(--line);background:var(--panel);padding:18px 20px}
.doc-top{display:flex;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:13px;color:var(--muted)}
.doc-top b{display:block;font-size:16px;color:var(--ink);margin-bottom:2px}
.doc-top .r{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.doc-tag{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ember-deep);background:var(--ember-tint);padding:4px 8px;margin-bottom:4px}
.doc-row{display:grid;grid-template-columns:1fr 44px 96px;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink)}
.doc-row .q{color:var(--stone);text-align:right;font-variant-numeric:tabular-nums}
.doc-row .s{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.doc-sum{display:flex;justify-content:flex-end;gap:32px;padding:6px 0;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.doc-sum.total{border-top:1px solid var(--ink);margin-top:6px;padding-top:10px;font-weight:600;color:var(--ink);font-size:16px}
/* mock: dienos žurnalas */
.log{padding:14px 18px 8px;font-size:14px}
.log-chip{display:inline-block;font-size:12.5px;font-weight:600;color:var(--ember-deep);background:var(--ember-tint);padding:6px 12px;margin-bottom:14px}
.log-check{display:flex;gap:10px;padding:5px 0;color:var(--ink)}
.log-check::before{content:"✓";color:var(--ember);font-weight:700;flex:none}
.log-row{display:grid;grid-template-columns:56px 1fr 1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.log-row:first-of-type{margin-top:10px}
.log-row .ok{color:var(--ink);font-weight:500}
.log-row .flag{font-size:12.5px;color:var(--ember-deep);font-weight:600}
@media(max-width:560px){.kv-row{grid-template-columns:1fr;gap:4px}.doc-row{grid-template-columns:1fr 36px 80px}.log-row{grid-template-columns:50px 1fr;gap:4px 10px}.msg{max-width:92%}}
.case-cta{display:inline-block;margin-top:30px;font-weight:600;font-size:17px;color:var(--ember-deep);text-decoration:none;letter-spacing:-.01em}
.case-cta:hover{color:var(--ember)}
.case-no{position:absolute;right:-16px;bottom:-52px;font-family:var(--display);font-weight:300;font-size:190px;letter-spacing:-.06em;color:var(--paper-2);line-height:1;pointer-events:none;z-index:0}
.case>*{position:relative;z-index:1}
.case>.case-no{z-index:0}
.cases .stats{margin-top:64px}
@media(max-width:1024px){.cases-grid{grid-template-columns:1fr;gap:28px}.case-rail{position:static;flex-direction:row;overflow-x:auto;border-top:0;border-bottom:1px solid var(--line)}.case-rail button{border-bottom:0;border-left:0;border-bottom:2px solid transparent;padding:14px 12px;font-size:17px;white-space:nowrap;grid-template-columns:auto 1fr}.case-rail button .arr{display:none}.case-rail button.on{border-bottom-color:var(--ember)}}
@media(max-width:560px){.case-stats{grid-template-columns:1fr}.bar-row{grid-template-columns:70px 1fr 48px}}
/* SEKTORIŲ KORTELĖS (senos, nebenaudojamos) - balta kortelė + tamsi plytelė */
.tabs{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin:44px 0 28px;font-size:14px;font-weight:500;color:var(--stone)}
.tabs span{padding-bottom:8px;border-bottom:2px solid transparent}
.tabs span.on{color:var(--ember-deep);border-color:var(--ember)}
.ind{display:grid;grid-template-columns:1.15fr .85fr;gap:0;border:1px solid var(--line);background:var(--panel);margin-bottom:18px}
.ind .l{padding:clamp(28px,3.5vw,48px)}
.ind .l h3{font-size:clamp(26px,2.8vw,36px);font-weight:300;letter-spacing:-.04em;margin-bottom:12px}
.ind .l p{color:var(--muted);max-width:52ch}
.ind ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-top:22px}
.ind li{display:flex;gap:10px;font-size:14.5px;color:var(--ink)}
.ind li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ember);flex:none;margin-top:9px}
.ind .r{background:var(--ink);color:var(--paper);padding:clamp(28px,3.5vw,48px);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.ind .r::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.12)}
.ind .r .k{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:500}
.ind .r .big{font-family:var(--display);font-weight:300;font-size:clamp(36px,4.2vw,58px);letter-spacing:-.045em;line-height:1;margin:22px 0 10px}
.ind .r .big .was{display:block;font-size:.42em;color:rgba(255,255,255,.45);text-decoration:line-through;letter-spacing:-.02em;margin-bottom:8px}
.ind .r p{color:rgba(255,255,255,.7);font-size:14.5px;max-width:30ch}
.ind .r .em{color:var(--ember-bright)}

/* PROBLEMA - sąrašas + proza */
.prob-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:64px;margin-top:56px;align-items:start}
.prob-list{list-style:none;display:flex;flex-direction:column}
.prob-list li{padding:16px 0;border-top:1px solid var(--line);font-family:var(--display);font-weight:400;font-size:clamp(17px,1.6vw,20px);letter-spacing:-.02em;display:flex;gap:16px;align-items:baseline}
.prob-list li:last-child{border-bottom:1px solid var(--line)}
.prob-list li::before{content:"";width:8px;height:8px;background:var(--ember);flex:none;transform:translateY(-2px)}
.prob-prose p{color:var(--muted);margin-bottom:18px;max-width:54ch}
.prob-prose p b{color:var(--ink);font-weight:600}
.prob-prose .punch{font-family:var(--display);font-weight:400;font-size:clamp(20px,2vw,26px);letter-spacing:-.03em;color:var(--ink);line-height:1.25;margin:26px 0}

/* PARTNERIS - 5 stulpeliai be kortelių */
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:40px;margin-top:72px;position:relative;padding-top:38px}
.roles::before{content:"";position:absolute;left:0;right:0;top:7px;height:1px;background:var(--ember);opacity:.45}
.role{position:relative}
.role::before{content:"";position:absolute;left:0;top:-38px;width:15px;height:15px;border-radius:50%;background:var(--ember)}
@media(max-width:1024px){.roles::before,.role::before{display:none}.roles{padding-top:0}}
.role h3{font-size:18px;font-weight:500;letter-spacing:-.02em;margin-bottom:10px}
.role .no{font-family:var(--display);font-weight:300;font-size:15px;letter-spacing:.06em;color:var(--ember);margin-bottom:14px;font-variant-numeric:tabular-nums}
.role p{font-size:14.5px;color:var(--muted)}
.ready{margin-top:72px;background:var(--paper-2);border:1px solid var(--line);padding:32px 40px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.ready h3{font-weight:400;font-size:24px}
.ready p{color:var(--muted);font-size:15px;max-width:52ch;margin-top:6px}

/* PRINCIPAI - tamsi juosta */
.prin{display:grid;grid-template-columns:1fr 1.2fr;gap:64px;align-items:start}
.prin .txt h2{font-size:clamp(36px,4.4vw,60px)}
.prin .txt h2 .acc{color:var(--ember-bright)}
.prin .txt p{color:rgba(255,255,255,.72);margin-top:24px;max-width:48ch}
.prin .txt p .acc{color:var(--ember-bright)}
.prin-list{display:flex;flex-direction:column}
.prin-item{border-top:1px solid var(--line-dark)}
.prin-item:last-child{border-bottom:1px solid var(--line-dark)}
.prin-item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:36px 1fr;gap:14px;align-items:start;padding:18px 0;font-family:var(--display);font-weight:300;font-size:clamp(18px,1.8vw,23px);letter-spacing:-.025em;line-height:1.25;color:rgba(255,255,255,.88)}
.prin-item summary::-webkit-details-marker{display:none}
.prin-item summary .no{font-family:var(--body);font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.45);font-weight:500;padding-top:7px;font-variant-numeric:tabular-nums;transition:color .2s var(--ease)}
.prin-item[open] summary .no,.prin-item summary:hover .no{color:var(--ember-bright)}
.prin-item[open] summary{color:#fff}
.prin-item summary b{font-weight:500;color:#fff}
.prin-item p{padding:0 0 22px 50px;color:rgba(255,255,255,.66);font-size:15px;line-height:1.6;max-width:56ch}
@media(max-width:560px){.prin-item p{padding-left:0}}

/* ĮRODYMAI, NE PAŽADAI */
.proof-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:56px}
.pf{border:1px solid var(--line);background:var(--panel);padding:32px 30px}
.pf .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);font-weight:500}
.pf .n{font-family:var(--display);font-weight:300;font-size:clamp(44px,5vw,68px);letter-spacing:-.05em;line-height:1;margin:22px 0 12px;font-variant-numeric:tabular-nums}
.pf .n .u{color:var(--ember)}
.pf .n .was{display:block;font-size:.4em;color:var(--faint);text-decoration:line-through;letter-spacing:-.02em;margin-bottom:6px}
.pf h3{font-size:19px;font-weight:500;letter-spacing:-.02em;margin-bottom:8px}
.pf p{font-size:14.5px;color:var(--muted)}
.feat{margin-top:18px;display:grid;grid-template-columns:1.3fr .7fr;gap:18px}
.feat .q{background:var(--paper-2);border:1px solid var(--line);padding:clamp(28px,3.5vw,48px)}
.feat .q .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember-deep);font-weight:500;margin-bottom:18px;display:block}
.feat .q p{font-family:var(--display);font-weight:300;font-size:clamp(22px,2.4vw,32px);letter-spacing:-.035em;line-height:1.2}
.feat .q p b{font-weight:500}
.feat .q .who{margin-top:22px;font-size:14px;color:var(--muted)}
.feat .g{background:var(--ink);color:var(--paper);padding:clamp(28px,3.5vw,48px);display:flex;flex-direction:column;justify-content:space-between}
.feat .g .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:500}
.feat .g .n{font-family:var(--display);font-weight:300;font-size:clamp(44px,5vw,72px);letter-spacing:-.05em;line-height:1;margin:18px 0 8px}
.feat .g .n .u{color:var(--ember-bright)}
.feat .g p{color:rgba(255,255,255,.7);font-size:14.5px}
.feat .g a{color:#fff;font-size:14px;font-weight:500;margin-top:22px;display:inline-block}

/* GARANTIJA */
.guar{border:1px solid var(--line);background:var(--panel);display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:56px}
.guar .a{padding:clamp(28px,3.5vw,48px);border-right:1px solid var(--line)}
.guar .b{padding:clamp(28px,3.5vw,48px);background:var(--paper-2)}
.guar h3{font-size:clamp(24px,2.6vw,34px);font-weight:300;letter-spacing:-.04em}
.guar .g-body{margin-top:20px;font-size:17px;line-height:1.55;color:var(--muted);max-width:44ch}
.guar .g-body b{color:var(--ink)}
.guar .g-body .hl{color:var(--ember-deep);font-weight:600}
.guar .b .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember-deep);font-weight:500;display:block;margin-bottom:16px}
.guar ol{list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:c}
.guar ol li{counter-increment:c;display:flex;gap:14px;font-size:15px;color:var(--ink);line-height:1.5}
.guar ol li::before{content:"(" counter(c) ")";font-family:var(--display);color:var(--ember);font-weight:500;flex:none}
.guar .pub{margin-top:22px;font-weight:600;font-size:14.5px}
.guar .b .btn{margin-top:26px}
.guar.single{grid-template-columns:1fr;max-width:860px;margin-left:auto;margin-right:auto}
.guar.single .a{border-right:0}
.guar.single .g-body{max-width:60ch}
.guar .pub a{color:var(--ember-deep)}

/* PASIŪLYMAS - offer kortelė */
.offer{margin-top:56px;border:2px solid var(--ember);background:var(--panel);padding:clamp(26px,3.5vw,44px)}
.offer-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px}
.offer-head .label{margin-bottom:0}
.offer-note{font-size:13.5px;color:var(--muted)}
.offer-grid{display:grid;grid-template-columns:1.35fr .9fr;gap:48px}
.offer-k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--stone);margin-bottom:12px}
.offer-list{list-style:none;display:flex;flex-direction:column}
.offer-list li{display:block;position:relative;padding:12px 0 12px 26px;border-top:1px solid var(--line);font-size:15px;color:var(--muted);line-height:1.5}
.offer-list li:last-child{border-bottom:1px solid var(--line)}
.offer-list li::before{content:"✓";color:var(--ember);font-weight:700;position:absolute;left:0;top:12px}
.offer-list li b{color:var(--ink);font-weight:600}
.offer-side{border-left:1px solid var(--line);padding-left:40px;display:flex;flex-direction:column}
.offer-side p{font-size:15px;color:var(--ink);margin-bottom:22px;line-height:1.55}
.offer-side .offer-k{margin-bottom:8px}
.offer-side .btn{align-self:flex-start;margin-top:auto}
.offer-side .micro{margin-top:10px}
.ladder-head{margin-top:72px;display:grid;grid-template-columns:200px 1fr;gap:32px;align-items:baseline}
.ladder-head p{color:var(--muted);font-size:16px;max-width:60ch}
.ladder-head .label{margin-bottom:0}
.step .tag{position:absolute;top:-11px;left:18px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#fff;background:var(--ember);padding:4px 9px}
.step.hi{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember)}
.step.core .tag{background:var(--ink)}
@media(max-width:860px){.offer-grid{grid-template-columns:1fr;gap:28px}.offer-side{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:24px}.ladder-head{grid-template-columns:1fr;gap:10px}}
/* KELIAS - laiptai su kylančiais blokais (logo motyvas) */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-top:56px;align-items:stretch}
.step{border:1px solid var(--line);background:var(--panel);padding:26px 22px 28px;display:flex;flex-direction:column;position:relative}
.step .blocks{display:flex;gap:4px;align-items:flex-end;height:34px;margin-bottom:22px}
.step .blocks i{display:block;width:12px;height:12px;background:var(--ember)}
.step .blocks i:nth-child(2){height:16px}.step .blocks i:nth-child(3){height:20px}.step .blocks i:nth-child(4){height:26px}.step .blocks i:nth-child(5){height:32px}
.step .no{font-family:var(--body);font-size:11.5px;letter-spacing:.12em;color:var(--stone);font-weight:500;font-variant-numeric:tabular-nums}
.step h3{font-size:clamp(19px,1.6vw,22px);font-weight:500;letter-spacing:-.025em;line-height:1.15;margin:8px 0 6px}
.step .meta{font-size:12.5px;color:var(--ember-deep);font-weight:600;letter-spacing:.01em;margin-bottom:18px}
.step dl{margin:0;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.step dt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);font-weight:600;margin-bottom:3px}
.step dd{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.step dd:last-child{color:var(--ink)}
@media(max-width:1180px){.steps{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.steps{grid-template-columns:1fr}}
/* FORMATAI (senas sąrašas, nebenaudojamas) */
.formats{margin-top:56px;border-top:1px solid var(--line)}
.fmt{display:grid;grid-template-columns:56px 1fr 1.15fr;gap:32px;padding:38px 0;border-bottom:1px solid var(--line);align-items:start}
.fmt .no{font-family:var(--body);font-size:12px;letter-spacing:.1em;color:var(--ember);font-weight:500;padding-top:9px;font-variant-numeric:tabular-nums}
.fmt h3{font-size:clamp(22px,2.4vw,30px);font-weight:400;letter-spacing:-.03em;line-height:1.15}
.fmt p{color:var(--muted);font-size:15.5px;max-width:52ch}
@media(max-width:860px){.fmt{grid-template-columns:40px 1fr;gap:12px 20px}.fmt p{grid-column:2}}
/* PRADĖK (senas) - du keliai, nebenaudojama */
.paths{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:56px}
.path{padding:clamp(28px,3.5vw,44px);border:1px solid var(--line);display:flex;flex-direction:column}
.path.beige{background:var(--paper-2)}
.path.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.path .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--ember-deep);margin-bottom:22px;display:inline-flex;align-items:center;gap:8px}
.path.ink .tag{color:var(--ember-bright)}
.path .tag::before{content:"";width:6px;height:6px;background:currentColor}
.path h3{font-size:clamp(26px,2.8vw,36px);font-weight:300;letter-spacing:-.04em}
.path .pr{font-family:var(--display);font-weight:400;font-size:clamp(28px,3vw,40px);letter-spacing:-.04em;margin:16px 0 6px}
.path .pr small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--stone);letter-spacing:0}
.path.ink .pr small{color:rgba(255,255,255,.55)}
.path .d{color:var(--muted);font-size:15px;max-width:46ch}
.path.ink .d{color:rgba(255,255,255,.72)}
.path ul{list-style:none;display:flex;flex-direction:column;gap:10px;margin:26px 0 30px}
.path li{display:flex;gap:12px;font-size:14.5px}
.path li::before{content:"✓";color:var(--ember);font-weight:600;flex:none}
.path.ink li::before{color:var(--ember-bright)}
.path .btn{margin-top:auto;align-self:flex-start}
.path .refund{margin-top:14px;font-size:13.5px;font-weight:600;color:var(--ember-deep)}
.ladder{margin-top:18px;border:1px solid var(--line);background:var(--panel)}
.ladder .row{display:grid;grid-template-columns:1.1fr 2fr auto;gap:24px;padding:20px 28px;border-top:1px solid var(--line);align-items:baseline}
.ladder .row:first-child{border-top:none}
.ladder .row h4{font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:-.02em}
.ladder .row p{font-size:14px;color:var(--muted)}
.ladder .row .pr{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:-.03em;white-space:nowrap;text-align:right}
.price-ctx{margin-top:18px;font-size:14px;color:var(--muted);max-width:80ch}
.price-ctx b{color:var(--ink)}
.anchors{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px;max-width:900px}
.anchor{border-top:1px solid var(--line);padding-top:18px}
.anchor h4{font-family:var(--display);font-weight:500;font-size:16px;letter-spacing:-.02em;margin-bottom:6px}
.anchor p{font-size:14.5px;color:var(--muted)}
.anchor p b{color:var(--ink)}

/* DUK */
.faq{max-width:820px;margin:48px auto 0}
.faq details{border-top:1px solid var(--line);padding:20px 0}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{font-family:var(--display);font-weight:400;font-size:clamp(17px,1.7vw,20px);letter-spacing:-.025em;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:20px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--ember);font-size:22px;font-weight:300;line-height:1;flex-shrink:0;transition:transform .25s var(--ease)}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{color:var(--muted);margin-top:12px;font-size:15px;max-width:64ch}
.faq details p b{color:var(--ink)}

/* BOOKING */
.book .cal-slot{margin:48px auto 0;max-width:880px;min-height:540px;border:1px dashed rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px;text-align:center}
.book .cal-note{color:rgba(255,255,255,.55);font-size:14px;max-width:42ch}
.book .micro{color:rgba(255,255,255,.55)}
.confirm{display:none;margin:20px auto 0;max-width:880px;border:1px solid var(--ember);padding:30px}
.confirm h3{font-size:22px;margin-bottom:12px}
.confirm p{color:rgba(255,255,255,.72);font-size:15px}
.confirm p b{color:#fff}
.form-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;max-width:1000px;margin:48px auto 0}
.form-intro{grid-column:1 / -1;font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:-.02em;border-top:1px solid var(--line-dark);padding-top:26px}
.form-wrap{border:1px solid var(--line-dark);padding:30px}
.field{margin-bottom:16px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.field .opt{font-weight:400;color:rgba(255,255,255,.45)}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,.35)}
