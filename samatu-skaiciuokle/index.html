<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pramoninės statybos sąmatų skaičiuoklė</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Pramoninės statybos sąmatų skaičiuoklė: kiekiai, savikaina, marža, variantai ir PDF pasiūlymai.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2300422E'/%3E%3Cpath d='M8 9h16v2.6H8zM8 14.7h16v2.6H8zM8 20.4h10v2.6H8z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F4F4F2; --surface:#FFFFFF; --surface-2:#F7F7F5; --surface-3:#EEEEEA;
  --ink:#10201A; --ink-2:#3E4A45; --muted:#646C67; --faint:#7F8781;
  --line:#E2E2DE; --line-strong:#CACBC6;
  --brand:#00422E; --brand-2:#256A55; --brand-soft:#E3EEE9; --brand-ink:#FFFFFF;
  --accent:#32C973; --accent-soft:#DDF5E7;
  --warn:#8F5F12; --warn-soft:#FBF1DC; --crit:#B42323; --crit-soft:#FBE3E3; --info:#3D5A80; --info-soft:#E6EDF6;
  --c-d:#00422E; --c-m:#4F8C76; --c-me:#9DBFB1; --c-s:#C9A227; --c-o:#8A8F8C; --c-r:#C7CAC6; --c-p:#32C973;
  --shadow:0 1px 2px rgba(16,32,26,.05), 0 6px 20px -12px rgba(16,32,26,.18);
  --radius:8px; --radius-s:6px;
  --font:"Plex", "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#151E1A; --surface-2:#1A2520; --surface-3:#223029;
    --ink:#E7EEEA; --ink-2:#B9C6BF; --muted:#8C9A93; --faint:#66736C;
    --line:#26332D; --line-strong:#35443D;
    --brand:#5FD39A; --brand-2:#7FDDB0; --brand-soft:#16352A; --brand-ink:#0E1512;
    --accent:#32C973; --accent-soft:#143324;
    --warn:#E0A94A; --warn-soft:#33280F; --crit:#F06A6A; --crit-soft:#3A1717; --info:#8FB2DE; --info-soft:#172433;
    --c-d:#5FD39A; --c-m:#3FA27E; --c-me:#2D6E57; --c-s:#D9B546; --c-o:#7D8782; --c-r:#4A5550; --c-p:#32C973;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#151E1A; --surface-2:#1A2520; --surface-3:#223029;
  --ink:#E7EEEA; --ink-2:#B9C6BF; --muted:#8C9A93; --faint:#66736C;
  --line:#26332D; --line-strong:#35443D;
  --brand:#5FD39A; --brand-2:#7FDDB0; --brand-soft:#16352A; --brand-ink:#0E1512;
  --accent:#32C973; --accent-soft:#143324;
  --warn:#E0A94A; --warn-soft:#33280F; --crit:#F06A6A; --crit-soft:#3A1717; --info:#8FB2DE; --info-soft:#172433;
  --c-d:#5FD39A; --c-m:#3FA27E; --c-me:#2D6E57; --c-s:#D9B546; --c-o:#7D8782; --c-r:#4A5550; --c-p:#32C973;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{color-scheme:light dark;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- viršutinė juosta ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1560px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{height:34px;min-width:34px;padding:0 8px;border-radius:6px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:600;font-size:14px;letter-spacing:.14em}
.brand-mark img{max-height:26px;max-width:120px;display:block}
.brand-mark.has-logo{background:transparent;padding:0;height:auto;min-width:0}
.brand-mark.has-logo img{height:18px;max-height:18px;max-width:190px}
.brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-text b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.est-chip{display:flex;align-items:center;gap:8px;min-width:0;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);max-width:460px}
.est-chip .nr{font-weight:600;white-space:nowrap}
.est-chip .ttl{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.saved{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.saved.dirty i{background:var(--warn)}
.saved.err i{background:var(--crit)}

.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:var(--radius-s);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--ink-2)}
.btn svg{width:15px;height:15px;flex:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:transparent;color:var(--muted);padding:4px;border-radius:4px;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface-3);color:var(--ink)}
.icon-btn svg{width:15px;height:15px}

/* ---------- skirtukai ---------- */
.tabs-wrap{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs{max-width:1560px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:11px 14px 10px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab .n{font-size:11px;color:var(--faint);font-weight:600}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tab[aria-selected="true"] .n{color:var(--brand)}

/* ---------- išdėstymas ---------- */
.layout{max-width:1560px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.layout.full{grid-template-columns:minmax(0,1fr)}
.main{min-width:0}
.rail{position:sticky;top:112px;display:flex;flex-direction:column;gap:12px}
@media (max-width:1100px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;order:-1}
}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:14px;align-items:start}
@media (max-width:1000px){.cols2{grid-template-columns:minmax(0,1fr)}}
.toolbar > *{max-width:100%}
.search{min-width:0;flex:1 1 200px}
th.nu{text-transform:none!important}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
@media (max-width:640px){
  .topbar-in{padding:8px 16px;gap:10px}
  .layout{padding:16px 16px 90px}
  .tabs{padding:0 12px}
  .est-chip{display:none}
  .top-actions .btn .lbl{display:none}
  .rail{display:none}
  .mobile-bar{display:flex!important}
}
.mobile-bar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;gap:16px;align-items:center;justify-content:space-between}
.mobile-bar b{font-size:17px}

/* ---------- kortelės ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.card-h{padding:14px 18px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:15px;overflow-wrap:anywhere}
.card-h .sub{font-size:12.5px;color:var(--muted)}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:16px 18px}
.card-b.tight{padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 14px}
.grid.g2{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.grid.g4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.span2{grid-column:span 2} .spanall{grid-column:1/-1}
@media (max-width:640px){.span2{grid-column:auto}}

/* ---------- laukai ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label, .field > .lbl{font-size:12px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:6px}
.field .hint{font-size:11.5px;color:var(--muted);line-height:1.35}
.inp, select.inp, textarea.inp{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius-s);padding:7px 9px;font-size:13.5px;min-height:34px}
textarea.inp{min-height:90px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--brand-2);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.inp.num{text-align:right}
.inp.auto{color:var(--muted)}
.unit-wrap{position:relative;display:flex;align-items:center}
.unit-wrap .inp{padding-right:44px}
.unit-wrap .u{position:absolute;right:9px;font-size:12px;color:var(--muted);pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:2px 6px;border-radius:4px;background:var(--surface-3);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.badge.auto{background:var(--brand-soft);color:var(--brand)}
.badge.man{background:var(--warn-soft);color:var(--warn)}
.badge.crit{background:var(--crit-soft);color:var(--crit)}
.badge.ok{background:var(--accent-soft);color:var(--brand)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius-s);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:12.5px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.switch{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;color:var(--ink-2);user-select:none;min-height:34px}
.switch input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line-strong);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--brand)}
.switch input:checked::after{transform:translateX(14px)}
.derived{display:flex;flex-wrap:wrap;gap:6px 18px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--radius) var(--radius);font-size:12.5px;color:var(--ink-2)}
.derived b{color:var(--ink);font-weight:600}

/* Pastato tipų kortelės */
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.type-card{border:1px solid var(--line-strong);border-radius:var(--radius);padding:12px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px;min-height:84px}
.type-card b{font-size:13.5px;font-weight:600}
.type-card span{font-size:11.5px;color:var(--muted)}
.type-card[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:var(--brand-soft)}

/* ---------- lentelės ---------- */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0;z-index:1;white-space:nowrap}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r, table.t th.r{text-align:right}
table.t tr.sec td{background:var(--surface-3);font-weight:600;font-size:12.5px;padding:9px 10px}
table.t tr.sec td .sec-sum{float:right}
table.t tr.sub td{font-weight:600;background:var(--surface-2)}
table.t tr.off td{opacity:.45}
table.t tr.zero td{color:var(--faint)}
table.t tr:hover td{background:color-mix(in srgb, var(--brand-soft) 35%, transparent)}
table.t tr.sec:hover td{background:var(--surface-3)}
table.t .code{font-size:11.5px;color:var(--muted);white-space:nowrap}
table.t .nm{min-width:260px}
table.t input.cell{width:100%;min-width:74px;border:1px solid transparent;background:transparent;border-radius:4px;padding:4px 6px;text-align:right;font-size:13px}
table.t input.cell:hover{border-color:var(--line-strong)}
table.t input.cell:focus{border-color:var(--brand-2);background:var(--surface);outline:none}
table.t input.cell.txt{text-align:left}
table.t input.cell.man{background:var(--warn-soft)}
table.t tr.detail td{background:var(--surface-2);padding:6px 10px 12px 44px}
.parts{width:auto;border-collapse:collapse;font-size:12px}
.parts td{padding:3px 12px 3px 0;border:0!important;background:transparent!important}
.row-tools{display:flex;gap:2px;justify-content:flex-end;white-space:nowrap}
.total-row td{font-weight:600;font-size:14px;background:var(--brand-soft)!important;color:var(--ink)}

/* ---------- šoninė santrauka ---------- */
.sum-card{padding:16px 18px}
.sum-price{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.sum-sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:13px;margin-top:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font-weight:600}
.meter{height:8px;border-radius:999px;background:var(--surface-3);position:relative;margin-top:8px}
.meter .band{position:absolute;top:0;bottom:0;background:var(--brand-soft);border-left:1px solid var(--brand-2);border-right:1px solid var(--brand-2)}
.meter .pin{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;background:var(--brand);transform:translateX(-1px)}
.meter-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-3);margin-top:10px}
.stack span{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12px;margin-top:10px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.margin-pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;padding:3px 8px;border-radius:999px;font-size:12.5px}
.margin-pill.ok{background:var(--accent-soft);color:var(--brand)}
.margin-pill.low{background:var(--crit-soft);color:var(--crit)}
.warns{display:flex;flex-direction:column;gap:6px}
.warn{display:flex;gap:8px;font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:var(--radius-s);background:var(--info-soft);color:var(--ink-2)}
.warn.warn-l{background:var(--warn-soft)}
.warn.crit{background:var(--crit-soft);color:var(--ink)}
.warn svg{width:15px;height:15px;flex:none;margin-top:1px}
.warn.crit svg{color:var(--crit)} .warn.warn-l svg{color:var(--warn)} .warn svg{color:var(--info)}

/* ---------- kainos žingsniai ---------- */
.wf{width:100%;border-collapse:collapse;font-size:13.5px}
.wf td{padding:8px 0;border-bottom:1px solid var(--line)}
.wf td.r{text-align:right}
.wf td.p{color:var(--muted);text-align:right;width:90px;font-size:12.5px}
.wf tr.strong td{font-weight:600}
.wf tr.grand td{font-weight:600;font-size:16px;border-bottom:0;padding-top:12px;color:var(--brand)}
.wf tr.minus td{color:var(--crit)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;background:var(--surface-2)}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font-size:18px;font-weight:600;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---------- įvairūs ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .sp{flex:1}
.search{min-width:220px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;line-height:1.5}
.pdf-frame{width:100%;height:78vh;min-height:520px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-3)}
.list-edit{display:flex;flex-direction:column;gap:6px}
.list-edit .row{display:flex;gap:6px;align-items:flex-start}
.list-edit .row textarea{min-height:38px}
.cmp td,.cmp th{white-space:nowrap}
.cmp td.best{color:var(--brand);font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:all .2s;z-index:100;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px -20px rgba(0,0,0,.4);width:min(720px,94vw)}
dialog::backdrop{background:rgba(10,20,15,.45)}
dialog .d-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
dialog .d-h h3{font-size:15px}
dialog .d-b{padding:16px 18px;max-height:70vh;overflow:auto}
dialog .d-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.grp-h{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--brand);padding-top:10px;margin-top:4px;border-top:1px solid var(--line)}
.grp-h:first-child{border-top:0;padding-top:0;margin-top:0}
.intro{background:var(--brand-soft);border-color:transparent;box-shadow:none}
.intro-row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.steps{margin:8px 0 8px;padding-left:20px;display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.steps b{color:var(--ink);font-weight:600}
@media (max-width:640px){.intro-row{flex-direction:column}}
.foot{max-width:1560px;margin:0 auto;padding:4px 20px 30px;font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
@media print{.topbar,.tabs-wrap,.rail,.foot,.mobile-bar{display:none!important}.layout{display:block;padding:0}}

</style>
</head>
<body>

    set('LT-01', extOn ? pick('netWater', 60) : 0);
    set('LT-02', extOn ? pick('netSewer', g.admTotal > 0 ? 60 : 25) : 0);
    set('LT-03', extOn ? pick('netStorm', Math.round((A + paved) / 40)) : 0);
    set('LT-04', extOn ? pick('oilSep', paved > 0 ? 1 : 0) : 0);
    set('LT-05', extOn ? pick('netElec', 120) : 0);
    // Apytikslė įrengtoji galia, kW: transformatorinė, kai > 400 kW arba plotas > 10 000 m²
    const loadKw = g.hall * (p.elec === 'G' ? 0.06 : 0.015) + (p.cold ? 0.07 * g.hall : 0) + ((p.heating === 'SS' || p.heating === 'GR') ? 0.04 * g.hall : 0) + g.admTotal * 0.05 + p.craneCount * 25;
    auto.loadKw = Math.round(loadKw);
    const trafo = extOn ? pick('trafo', (loadKw > 400 || g.GFA > 10000) ? 1 : 0) : 0;
    set('LT-06', trafo);
    set('LT-07', extOn ? pick('lights', Math.ceil(paved / 450) + Math.ceil(P / 45)) : 0);
    set('LT-08', extOn ? pick('hydrants', Math.max(1, Math.ceil(P / 180))) : 0);
    set('LT-09', extOn && p.fireTank ? 1 : 0);
    set('LT-10', extOn ? pick('stormTank', Math.round(0.02 * (A + paved))) : 0);
    set('LT-12', extOn ? pick('gasLine', (p.heating === 'IR' || p.heating === 'OR') ? 50 : 0) : 0);
    set('LT-13', extOn ? pick('cable10', trafo > 0 ? 150 : 0) : 0);
    const cars = Math.round(parking / 25);
    set('LT-11', extOn ? pick('ev', cars > 10 ? Math.max(2, Math.round(cars * 0.1)) : 0) : 0);
    set('AP-01', yardHeavy);
    set('AP-02', parking);
    set('AP-03', extOn ? pick('sidewalk', Math.round(P * 0.3)) : 0);
    set('AP-04', extOn ? pick('curbs', Math.round(0.06 * paved + P * 0.3)) : 0);
    const fence = extOn ? pick('fence', 0) : 0;
    set('AP-05', fence);
    set('AP-06', extOn ? pick('gates', fence > 0 ? 1 : 0) : 0);
    set('AP-07', extOn ? pick('barrier', parking > 0 ? 1 : 0) : 0);
    set('AP-08', extOn ? pick('green', Math.round(A * 0.2)) : 0);
    set('AP-09', extOn ? p.docks : 0);
    set('AP-10', extOn && p.gatehouse ? 1 : 0);

    // Projektavimas
    set('PR-01', p.design ? 1 : 0);
    set('PR-02', p.surveys ? 1 : 0);
    set('PR-03', p.surveys ? 1 : 0);
    set('PR-04', p.permits ? 1 : 0);
    set('PR-05', p.completion ? 1 : 0);
    // Ypatingasis statinys (tarpatramis > 12 m arba plotas > 2 000 m²): privaloma projekto ekspertizė
    const special = g.span > 12 || g.GFA > 2000;
    set('PR-06', p.design && special ? 1 : 0);
    set('PR-07', p.design ? 1 : 0);
    auto.special = special;

    // Statybvietė
    const autoMonths = clamp(halfUp(3 + 1.35 * Math.sqrt(g.GFA / 1000) + (g.admTotal > 0 ? 0.5 : 0) + (p.sprinklers ? 0.5 : 0) + (p.soil === 'WEAK' ? 0.5 : 0)), 4, 30);
    const months = p.months || autoMonths;
    auto.months = autoMonths;
    // Sutrumpinus terminą statybvietės išlaidos nemažėja (skaičiuojamos pagal įprastą trukmę), o pagreitinimas kainuoja atskirai
    const siteMonths = Math.max(months, autoMonths);
    auto.compression = p.months ? Math.max(0, 1 - p.months / autoMonths) : 0;
    const foremen = Math.max(1, Math.ceil(g.GFA / 5000));
    auto.foremen = foremen;
    // Mažuose objektuose vadovaujantis personalas dirba ne visu etatu
    const staffF = clamp(0.5 + g.GFA / 6000, 0.6, 1);
    auto.staffF = r1(staffF * 100) / 100;
    ['SV-01', 'SV-02', 'SV-04'].forEach(k => set(k, siteMonths * staffF));
    ['SV-05', 'SV-06', 'SV-07', 'SV-08'].forEach(k => set(k, siteMonths));
    set('SV-03', siteMonths * foremen);
    set('SV-17', auto.compression > 0 ? 1 : 0);
    set('SV-09', 1);
    set('SV-10', Math.round(P * 1.5 + 40));
    set('SV-11', g.GFA); set('SV-12', g.GFA);
    const wm = winterMonths(p.start || defaultStart(), months);
    auto.winterMonths = wm;
    set('SV-13', wm);
    set('SV-13B', wm);
    set('SV-14', months > 0 ? concrete * Math.min(1, wm / months) : 0);
    auto.concrete = r1(concrete);
    set('SV-15', 0); // skaičiuojama antrajame žingsnyje pagal darbo valandas
    set('SV-16', Math.round(0.05 * A + 400));

    return { q, auto, months, concrete, yardHeavy, parking, staff };
  }

  function defaultStart() {
    const d = new Date(); d.setMonth(d.getMonth() + 3);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  // ---------- kainynas ----------
  function resourceMap(pb, mult) {
    const m = {};
    (pb.resources || []).forEach(x => {
      let price = num(x.price, 0);
      if (mult) { const f = mult(x); if (f) price *= f; }
      m[x.code] = { code: x.code, name: x.name, unit: x.unit, group: x.group, price };
    });
    return m;
  }
  function resolveCode(code, p) { const f = D.PLACEHOLDERS[code]; return f ? f(p) : code; }
  function itemName(item, p) {
    let n = item.name;
    Object.keys(D.NAME_TOKENS).forEach(t => { if (n.indexOf(t) >= 0) n = n.split(t).join(D.NAME_TOKENS[t](p)); });
    return n;
  }
  const GKEY = { darbas: 'd', medziagos: 'm', mechanizmai: 'me', subranga: 's' };
  function unitCostOf(item, p, res) {
    const u = { d: 0, m: 0, me: 0, s: 0, total: 0, hours: 0, crewHours: 0, parts: [], missing: [] };
    (item.norms || []).forEach(([code0, qty]) => {
      const code = resolveCode(code0, p);
      const rr = res[code];
      if (!rr) { u.missing.push(code); return; }
      const v = num(qty, 0) * rr.price;
      const k = GKEY[rr.group] || 's';
      u[k] += v;
      if (rr.group === 'darbas' && rr.unit === 'val.') { u.hours += num(qty, 0); if (code === 'D-BEN' || code === 'D-BET') u.crewHours += num(qty, 0); }
      u.parts.push({ code, name: rr.name, unit: rr.unit, qty: num(qty, 0), price: rr.price, value: v, group: rr.group });
    });
    u.total = u.d + u.m + u.me + u.s;
    return u;
  }

  // ---------- komercinė dalis ----------
  function defaultCommercial(policyKey, settings) {
    const pol = D.POLICIES[policyKey] || D.POLICIES.PRIV;
    return {
      policy: policyKey in D.POLICIES ? policyKey : 'PRIV',
      overheadPct: pol.overheadPct,
      riskMode: 'AUTO', riskPct: 5,
      escMode: 'AUTO', escPct: 0, annualIndexPct: settings && settings.annualIndexPct != null ? settings.annualIndexPct : 4,
      carPct: 0.15,
      guarPct: pol.guarPct, guarFeePct: 1.2,
      warrGuarPct: 5, warrYears: 3,
      warrResPct: 0.5,
      profitMode: 'MARGIN', profitPct: pol.profitPct, targetPrice: null,
      discountPct: 0, roundStep: 0,
      vatMode: pol.vatMode || 'STD', vatPct: 21, rcDesign: true,
      minMarginPct: pol.minMarginPct,
      advancePct: pol.advancePct, retentionPct: pol.retentionPct, payDays: 30, supDays: 30,
      approvedBy: '', approvedAt: ''
    };
  }

  function normCommercial(cIn) {
    const c = Object.assign(defaultCommercial((cIn && cIn.policy) || 'PRIV'), cIn || {});
    ['overheadPct', 'riskPct', 'escPct', 'annualIndexPct', 'carPct', 'guarPct', 'guarFeePct', 'warrGuarPct', 'warrYears', 'warrResPct', 'profitPct', 'discountPct', 'roundStep', 'vatPct', 'minMarginPct', 'advancePct', 'retentionPct'].forEach(k => { c[k] = num(c[k], 0); });
    c.payDays = clamp(num(c.payDays, 30), 0, 120); c.supDays = clamp(num(c.supDays, 30), 0, 120);
    c.advancePct = clamp(c.advancePct, 0, 100); c.retentionPct = clamp(c.retentionPct, 0, Math.max(0, 100 - c.advancePct));
    c.guarPct = clamp(c.guarPct, 0, 100); c.warrGuarPct = clamp(c.warrGuarPct, 0, 100); c.carPct = clamp(c.carPct, 0, 10); c.warrResPct = clamp(c.warrResPct, 0, 10); c.guarFeePct = clamp(c.guarFeePct, 0, 10); c.warrYears = clamp(c.warrYears, 0, 20);
    c.minMarginPct = clamp(c.minMarginPct, -20, 50);
    c.approvedMargin = c.approvedMargin === undefined || c.approvedMargin === null || c.approvedMargin === '' ? null : num(c.approvedMargin, null);
    c.overheadPct = clamp(c.overheadPct, 0, 40);
    c.riskPct = clamp(c.riskPct, 0, 40);
    c.escPct = clamp(c.escPct, 0, 40);
    c.annualIndexPct = clamp(c.annualIndexPct, -10, 30);
    c.profitPct = clamp(c.profitPct, -20, c.profitMode === 'MARKUP' ? 200 : 60);
    c.discountPct = clamp(c.discountPct, 0, 50);
    c.vatPct = clamp(c.vatPct, 0, 50);
    c.roundStep = [0, 10, 100, 1000, 5000, 10000].includes(c.roundStep) ? c.roundStep : 0;
    c.targetPrice = c.targetPrice === null || c.targetPrice === '' || c.targetPrice === undefined ? null : nn(num(c.targetPrice, 0));
    return c;
  }

  // ---------- pagrindinis skaičiavimas ----------
  function compute(est, pb, opts) {
    opts = opts || {};
    const p = normParams(est.p);
    const c = normCommercial(est.c);
    const g = geometry(p);
    const Q = quantities(p, g);
    const res = resourceMap(pb, opts.mult);
    const ov = est.ov || {};
    const secMap = {}; D.SECTIONS.forEach(s => { secMap[s.id] = s; });
    const warnings = [];
    const lines = [];
    const missingAll = new Set();

    const items = pb.items && pb.items.length ? pb.items : D.ITEMS;
    let ownHours = 0, laborHours = 0;
    items.forEach(item => {
      if (!secMap[item.sec]) return;
      const o = ov[item.code] || {};
      const qtyAuto = r2(Q.q[item.code] !== undefined ? Q.q[item.code] : 0);
      const hasQ = o.q !== undefined && o.q !== null && o.q !== '' && Number.isFinite(num(o.q, NaN));
      let qty = r2(hasQ ? nn(num(o.q, 0)) : qtyAuto);
      if (o.off) qty = 0;
      const u = unitCostOf(item, p, res);
      u.missing.forEach(m => missingAll.add(m));
      const hasUc = o.uc !== undefined && o.uc !== null && o.uc !== '' && Number.isFinite(num(o.uc, NaN));
      const line = {
        code: item.code, sec: item.sec, name: itemName(item, p), unit: item.unit,
        qtyAuto, qty, overridden: hasQ, off: !!o.off, manualUc: hasUc, pct: item.pct || null,
        u, note: o.note || '', custom: false
      };
      if (hasUc) {
        const uc = nn(num(o.uc, 0));
        const base = u.total;
        // rankinė vieneto kaina: išlaikoma sudėtis proporcingai, jei ji žinoma
        if (base > 0) { const f = uc / base; line.u = Object.assign({}, u, { d: u.d * f, m: u.m * f, me: u.me * f, s: u.s * f, total: uc }); }
        else line.u = Object.assign({}, u, { d: 0, m: 0, me: 0, s: uc, total: uc });
      }
      if (item.sec !== 'SV') { ownHours += qty * (u.crewHours || 0); laborHours += qty * (u.hours || 0); }
      lines.push(line);
    });

    // Mobilumas: savų brigadų (betonavimo ir bendrųjų darbų) žmogaus dienos, kai objektas toliau nei 50 km nuo bazės
    const workerDays = ownHours / 8;
    const mob = lines.find(l => l.code === 'SV-15');
    if (mob) { mob.qtyAuto = p.distKm > 50 ? Math.round(workerDays) : 0; if (!mob.overridden && !mob.off) mob.qty = mob.qtyAuto; }

    // Individualios eilutės
    (est.custom || []).forEach((x, i) => {
      const sec = secMap[x.sec] ? x.sec : 'KT';
      const d = nn(num(x.d, 0)), m = nn(num(x.m, 0)), me = nn(num(x.me, 0)), s = nn(num(x.s, 0));
      lines.push({
        code: x.code || ('KT-' + String(i + 1).padStart(2, '0')), id: x.id, sec, name: x.name || 'Nauja pozicija', unit: x.unit || 'vnt.',
        qtyAuto: 0, qty: x.off ? 0 : r2(nn(num(x.q, 0))), overridden: false, off: !!x.off, manualUc: false, pct: null,
        u: { d, m, me, s, total: d + m + me + s, hours: 0, parts: [], missing: [] }, note: x.note || '', custom: true
      });
    });

    // Sumos (be projektavimo procentinės pozicijos)
    lines.forEach(l => { if (!l.pct) l.total = l.qty * l.u.total; });
    const sumKind = kind => lines.filter(l => !l.pct && (secMap[l.sec] || {}).kind === kind).reduce((a, l) => a + l.total, 0);
    const construction0 = sumKind('build');
    const site0 = sumKind('site');
    const bs = { d: 0, me: 0, s: 0 };
    lines.forEach(l => { if (!l.pct && (secMap[l.sec] || {}).kind === 'build') { bs.d += l.qty * l.u.d; bs.me += l.qty * l.u.me; bs.s += l.qty * l.u.s; } });
    const formula = (l, v) => { if (!l.manualUc) l.u = { d: 0, m: 0, me: 0, s: v, total: v, hours: 0, crewHours: 0, parts: [], missing: [] }; l.total = l.qty * l.u.total; };
    // Projektavimas % nuo statybos ir statybvietės išlaidų
    lines.forEach(l => {
      if (l.pct === 'expertise') formula(l, 2000 + 0.45 * g.GFA);
      if (l.pct === 'supervision') formula(l, (construction0 + site0) * 0.0035);
      if (l.pct === 'winterHeat') formula(l, g.volume * (res['SB-ZIEM-V'] ? res['SB-ZIEM-V'].price : 0.15));
      // Pagreitinimas: 50 % suspaudimo dalies nuo darbo, mechanizmų ir 35 % subrangos išlaidų
      if (l.pct === 'accel') formula(l, 0.5 * (Q.auto.compression || 0) * (bs.d + bs.me + 0.35 * bs.s));
      if (l.pct === 'design') {
        if (!l.manualUc) { const v = (construction0 + site0) * p.designPct / 100; l.u = { d: 0, m: 0, me: 0, s: v, total: v, hours: 0, parts: [], missing: [] }; }
        l.total = l.qty * l.u.total;
      }
    });

    const sumAll = kind => lines.filter(l => (secMap[l.sec] || {}).kind === kind).reduce((a, l) => a + l.total, 0);
    const construction = sumAll('build');
    const site = sumAll('site');
    const design = sumAll('design');
    const C0 = construction + site + design;
    const split = { d: 0, m: 0, me: 0, s: 0 };
    lines.forEach(l => { const f = l.qty; split.d += f * l.u.d; split.m += f * l.u.m; split.me += f * l.u.me; split.s += f * l.u.s; });

    // Rizika ir kainų pokytis
    const riskPct = c.riskMode === 'AUTO' ? (D.RISK_BY_STAGE[p.stage] != null ? D.RISK_BY_STAGE[p.stage] : 5) : c.riskPct;
    const baseDate = pb.baseDate || '2026-09';
    const start = p.start || defaultStart();
    const monthsToMid = monthsBetween(baseDate, start) + Q.months / 2;
    let escPct = 0;
    if (c.escMode === 'AUTO') escPct = monthsToMid > 0 ? (Math.pow(1 + c.annualIndexPct / 100, monthsToMid / 12) - 1) * 100 : 0;
    else if (c.escMode === 'MANUAL') escPct = c.escPct;
    const overhead = C0 * c.overheadPct / 100;
    const risk = (construction + site) * riskPct / 100;
    const escalation = (construction + site) * escPct / 100;
    const S = C0 + overhead + risk + escalation;

    // Nuo kainos priklausančios išlaidos
    const ppParts = {
      car: c.carPct / 100,
      guar: (c.guarPct / 100) * (c.guarFeePct / 100) * ((Q.months + 3) / 12),
      warrGuar: (c.warrGuarPct / 100) * (1 + c.vatPct / 100) * (c.guarFeePct / 100) * c.warrYears,
      warrRes: c.warrResPct / 100,
      advGuar: (c.advancePct / 100) * (c.guarFeePct / 100) * (Q.months / 12) * 0.5
    };
    const pp = ppParts.car + ppParts.guar + ppParts.warrGuar + ppParts.warrRes + ppParts.advGuar;

    let P0 = 0, errPrice = '';
    if (c.profitMode === 'PRICE' && c.targetPrice !== null) {
      P0 = c.targetPrice;
    } else if (c.profitMode === 'MARKUP') {
      const k = c.profitPct / 100;
      const den = 1 - pp * (1 + k);
      if (den <= 0.05) { errPrice = 'Neįmanomas antkainio ir nuo kainos priklausančių išlaidų derinys.'; P0 = S * (1 + k); }
      else P0 = S * (1 + k) / den;
    } else {
      const m = c.profitPct / 100;
      const den = 1 - pp - m;
      if (den <= 0.05) { errPrice = 'Per didelė marža: kaina negali būti apskaičiuota.'; P0 = S; }
      else P0 = S / den;
    }
    const discountAmt = c.profitMode === 'PRICE' ? 0 : P0 * c.discountPct / 100;
    const P1 = P0 - discountAmt;
    const price = C0 > 0 ? (c.roundStep > 0 ? Math.round(P1 / c.roundStep) * c.roundStep : r2(P1)) : 0;
    const roundingAmt = price - r2(P1);
    const ppCost = pp * price;
    const profit = price - S - ppCost;
    const margin = price > 0 ? profit / price * 100 : 0;
    const markup = (S + ppCost) > 0 ? profit / (S + ppCost) * 100 : 0;
    const contribution = price - (C0 + risk + escalation + ppCost);
    const contributionPct = price > 0 ? contribution / price * 100 : 0;
    const denMin = 1 - pp - c.minMarginPct / 100;
    const minPrice = denMin > 0.05 ? S / denMin : NaN;
    const discBase = c.profitMode === 'PRICE' ? price : P0;
    const maxDiscountPct = discBase > 0 && Number.isFinite(minPrice) ? (1 - minPrice / discBase) * 100 : 0;

    // Pardavimo kainos paskirstymas eilutėms (vienodas koeficientas K). Skyriaus kaina = jo eilučių sumų suma,
    // todėl visur (lentelė, PDF, CSV) skaičiai sutampa; centų likutis rodomas atskira eilute „Apvalinimas“.
    const K = C0 > 0 ? price / C0 : 0;
    const P0r = c.profitMode === 'PRICE' ? price : r2(P0);
    const K0 = C0 > 0 ? P0r / C0 : 0;
    lines.forEach(l => {
      l.saleUnit = r2(l.u.total * K); l.saleTotal = r2(l.qty * l.saleUnit);
      l.saleUnit0 = r2(l.u.total * K0); l.saleTotal0 = r2(l.qty * l.saleUnit0);
    });
    const sections = D.SECTIONS.map(s => {
      const ls = lines.filter(l => l.sec === s.id);
      const cost = ls.reduce((a, l) => a + l.total, 0);
      const cs = { d: 0, m: 0, me: 0, s: 0 };
      ls.forEach(l => { cs.d += l.qty * l.u.d; cs.m += l.qty * l.u.m; cs.me += l.qty * l.u.me; cs.s += l.qty * l.u.s; });
      const sale = r2(ls.reduce((a, l) => a + l.saleTotal, 0)), sale0 = r2(ls.reduce((a, l) => a + l.saleTotal0, 0));
      return { id: s.id, name: s.name, kind: s.kind, cost, split: cs, sale, lineSale: sale, sale0, lineSale0: sale0, count: ls.filter(l => l.qty > 0).length };
    });
    sections.forEach(s => { s.share = price > 0 ? s.sale / price * 100 : 0; });
    const itemSaleSum = r2(sections.reduce((a, s) => a + s.sale, 0));
    const itemRounding = r2(price - itemSaleSum);
    const itemRounding0 = r2(P0r - sections.reduce((a, s) => a + s.sale0, 0));

    // Kas realiai įtraukta (atsižvelgiant į išjungtas eilutes): naudojama pasiūlymo tekstams
    const lq = code => { const l = lines.find(x => x.code === code); return l ? l.qty : 0; };
    const incl = {
      sprinklers: lq('IS-08') > 0, design: lq('PR-01') > 0, heating: lq('IS-01') > 0, surveys: lq('PR-02') > 0,
      fence: lq('AP-05') > 0, fireAlarm: lq('IS-06') > 0, hoseReels: lq('IS-10') > 0, supervision: lq('PR-07') > 0,
      ext: lines.some(l => (l.sec === 'LT' || l.sec === 'AP') && l.qty > 0), cold: lq('IS-14') > 0, pv: lq('IS-12'), cranes: lq('IS-13'), trafo: lq('LT-06') > 0
    };

    // PVM
    const designSale = sections.filter(s => s.kind === 'design').reduce((a, s) => a + s.sale, 0);
    let vat = 0, vatSelf = 0, vatNote = '';
    if (c.vatMode === 'RC') {
      const nonRc = c.rcDesign ? 0 : designSale;
      vat = r2(nonRc * c.vatPct / 100);
      vatSelf = r2((price - nonRc) * c.vatPct / 100);
      vatNote = 'Statybos darbams taikomas atvirkštinis PVM apmokestinimas (PVMĮ 96 str.): PVM apskaičiuoja ir sumoka paslaugų gavėjas.';
    } else {
      vat = r2(price * c.vatPct / 100);
    }
    const priceVat = r2(price + vat);

    // Įspėjimai
    const W = (lvl, msg) => warnings.push({ lvl, msg });
    if (missingAll.size) W('crit', 'Kainyne trūksta resursų: ' + Array.from(missingAll).join(', ') + '. Šios eilutės skaičiuojamos be jų.');
    if (errPrice) W('crit', errPrice);
    if (g.admTotal / p.admFloors > g.A + 1e-6) W('crit', 'Administracinių ir buitinių patalpų pirmo aukšto plotas viršija užstatymo plotą: padidinkite aukštų skaičių arba pastato gabaritus.');
    if (price > 0 && margin < c.minMarginPct - 1e-9) W('crit', 'Marža ' + fmtPct(margin) + ' žemiau maržos politikos ribos ' + fmtPct(c.minMarginPct) + ': reikia vadovo patvirtinimo.');
    if ((c.approvedBy || '').trim() && Number.isFinite(c.approvedMargin) && margin < c.approvedMargin - 0.05) W('warn', 'Patvirtinta esant ' + fmtPct(c.approvedMargin) + ' maržai, dabar ' + fmtPct(margin) + ': reikia patvirtinti iš naujo.');

  function client(ctx) {
    const doc = mk();
    const { e, r, settings: s, fmt: f } = ctx;

    const U = EN ? EN.UI : LT_UI;

      if (!EN || l.custom) return l.name;

    if (dt !== docTitle.toUpperCase()) dt = dt.replace(/\s+\S*$/, '') + '…';

    font(doc, 13, true, C.ink); doc.text(U.no + ' ' + ctx.nrFull, PW - MR, 24, { align: 'right' });
    font(doc, 8.2, false, C.muted); doc.text(U.date + ' ' + o.date + ' · ' + U.validUntil + ' ' + valid, PW - MR, 29, { align: 'right' });
    // Pavadinimas

    const tl = doc.splitTextToSize(X.objTitle || e.title || tName(r.p), CW);
    if (tl.length > 3) { tl.length = 3; tl[2] = tl[2].replace(/\s+\S*$/, '') + '…'; }

    const y1 = kvBlock(doc, ML, y, colW, U.client, [cl.name || U.client, cl.code ? U.companyCode + ' ' + cl.code : '', cl.contact, [cl.email, cl.phone].filter(Boolean).join(' · ')]);

    y = figures(doc, y, [[U.priceExVat, f.money0(T.price), 13.5, C.brand], [vatLbl, r.c.vatMode === 'RC' ? (T.vat > 0 ? f.money0(T.vat) : U.rcPayer) : f.money0(T.vat), r.c.vatMode === 'RC' && T.vat === 0 ? 9.5 : 12.5], [payLbl, f.money0(T.priceVat)], [U.perM2, f.money0(T.perM2)]]);

    const foot = [];

    }
    // Variantai
    if (o.showVariants !== false && ctx.vs.length > 1) {
      heading(doc, cur, U.variants, '', 20 + (11 + 2) * 7.2);
      const vs = ctx.vs;
      const yes = EN ? 'Yes' : 'Taip', no = EN ? 'No' : 'Ne';
      const frameN = { STEEL: EN ? 'Steel' : 'Plieninis', GB: EN ? 'Precast columns, steel trusses' : 'G/b kolonos, plieno santvaros', GBS: EN ? 'Precast columns and beams' : 'G/b kolonos ir sijos' };
      const heatN = EN ? { NONE: 'Unheated', IR: 'Gas infrared', OR: 'Air heaters', SS: 'Heat pumps', GR: 'Underfloor' } : { NONE: 'Nešildomas', IR: 'Dujiniai infraraudonieji', OR: 'Oro šildytuvai', SS: 'Šilumos siurbliai', GR: 'Grindinis' };
      const rows = [
        [EN ? 'Description' : 'Aprašymas'].concat(vs.map(x => x.v.title || '')),
        [U.gfa].concat(vs.map(x => f.fmtN(x.r.g.GFA) + ' m²')),
        [EN ? 'Structure' : 'Karkasas'].concat(vs.map(x => frameN[x.r.p.frame])),
        [EN ? 'Wall panels' : 'Sienų plokštės'].concat(vs.map(x => x.r.p.wallType + ' ' + x.r.p.wallT + ' mm')),
        [EN ? 'Heating' : 'Šildymas'].concat(vs.map(x => heatN[x.r.p.heating])),
        [EN ? 'Sprinklers' : 'Sprinkleriai'].concat(vs.map(x => x.r.p.sprinklers ? yes : no)),
        [EN ? 'Solar PV' : 'Saulės elektrinė'].concat(vs.map(x => x.r.p.pv > 0 ? f.fmtN(x.r.p.pv) + ' kWp' : no)),
        [EN ? 'Construction period' : 'Statybos trukmė'].concat(vs.map(x => (EN ? 'approx. ' : 'apie ') + f.fmtN(x.r.months, 1) + ' ' + U.months)),
        [U.perM2].concat(vs.map(x => f.money0(x.r.totals.perM2)))
      ];
      at(doc, tableBase({
        startY: cur.y, head: [[U.indicator].concat(vs.map(x => EN ? U.variant + ' ' + x.v.variant : x.v.variant + ' ' + U.variant))], body: rows,
        foot: [[U.priceExVat].concat(vs.map(x => f.money(x.r.totals.price))), [U.priceIncVat].concat(vs.map(x => f.money(x.r.totals.priceVat)))],
        columnStyles: Object.assign({ 0: { cellWidth: 38, textColor: C.muted } }, ...vs.map((x, i) => ({ [i + 1]: { cellWidth: (CW - 38) / vs.length } }))),
        didParseCell: d => { if (d.column.index > 0) d.cell.styles.halign = 'right'; if (d.section === 'body' && d.column.index > 0 && vs[d.column.index - 1] && vs[d.column.index - 1].v.id === e.id) d.cell.styles.fontStyle = 'bold'; }
      }));
      cur.y = doc.lastAutoTable.finalY + 8;
    }
    // Sąlygos
    if (o.showTerms !== false) {
      const assumptions = (X.assumptions || []).slice();
      const sn = stageNote(r.p, !!EN); if (sn) assumptions.unshift(sn);
      if (assumptions.length) { heading(doc, cur, U.assumptions, '', 24); bullets(doc, cur, assumptions); }
      if (X.exclusions.length) { heading(doc, cur, U.exclusions, '', 24); bullets(doc, cur, X.exclusions); }
      heading(doc, cur, U.payment, '', 22); para(doc, cur, X.payment, { after: 3 });
      if (X.warranty) { heading(doc, cur, U.warranty, '', 22); para(doc, cur, X.warranty, { after: 3 }); }
      heading(doc, cur, U.validity, '', 22);
      const midYM = addMonthsYM(r.p.start, (r.months || 0) / 2);
      const escTxt = r.c.escMode === 'NONE'
        ? (EN ? 'The price is based on the ' + (r.priceBook.baseDate || '') + ' price level; the contract will provide for price adjustment using the construction cost index published by the State Data Agency of Lithuania.'
              : 'Kaina apskaičiuota ' + (r.priceBook.baseDate || '') + ' kainų lygiu; sutartyje numatomas kainos perskaičiavimas pagal Valstybės duomenų agentūros skelbiamą statybos sąnaudų kainų indeksą.')
        : (EN ? 'The price includes the expected change in construction prices up to the middle of the works' + (midYM ? ' (' + midYM + ')' : '') + ', assuming the works start in ' + (r.p.start || '') + '. If the start is delayed by more than 3 months, the price may be adjusted using the construction cost index published by the State Data Agency of Lithuania.'
              : 'Kaina įvertina numatomą statybos kainų pokytį iki darbų vidurio' + (midYM ? ' (' + midYM + ')' : '') + ', kai darbai pradedami ' + (r.p.start || '') + '. Darbų pradžiai nusikėlus daugiau nei 3 mėnesiais, kaina gali būti perskaičiuota pagal Valstybės duomenų agentūros skelbiamą statybos sąnaudų kainų indeksą.');
      para(doc, cur, (EN ? 'This offer is valid until ' + valid + '. ' : 'Pasiūlymas galioja iki ' + valid + '. ') + escTxt, { after: 3 });
      if (r.c.vatMode === 'RC') {
        heading(doc, cur, U.vatH, '', 22);
        para(doc, cur, EN
          ? 'Construction works are subject to the domestic reverse charge under Article 96 of the Lithuanian VAT Law: VAT is accounted for by the Client as a VAT payer; invoices are marked "Reverse charge".' + (T.vat > 0 ? ' Design services are subject to standard VAT of ' + f.pctT(r.c.vatPct) + '.' : '')
          : 'Statybos darbams taikomas atvirkštinis PVM apmokestinimas pagal PVM įstatymo 96 straipsnį: PVM apskaičiuoja ir sumoka užsakovas, būdamas PVM mokėtoju; sąskaitose nurodoma „Atvirkštinis apmokestinimas“.' + (T.vat > 0 ? ' Projektavimo paslaugoms taikomas standartinis ' + f.pctT(r.c.vatPct) + ' PVM.' : ''), { after: 3 });
      }
      if (X.notes) { heading(doc, cur, U.notes, '', 22); para(doc, cur, X.notes, { after: 3 }); }
    }
    // Parašai
    ensure(doc, cur, 34);
    cur.y += 4;
    const pp = s.person;
    font(doc, 7, true, C.muted); spaced(doc, U.prepared.toUpperCase(), ML, cur.y, 0.35); spaced(doc, U.forContractor.toUpperCase(), ML + CW / 2 + 2, cur.y, 0.35);
    font(doc, 9.4, true, C.ink);
    if (pp.name) doc.text(pp.name, ML, cur.y + 6); else { doc.setDrawColor.apply(doc, C.line); doc.setLineWidth(0.25); doc.line(ML, cur.y + 6.5, ML + 62, cur.y + 6.5); }
    doc.text(sc.name || ' ', ML + CW / 2 + 2, cur.y + 6);
    font(doc, 8.4, false, C.ink2);
    let yy = cur.y + 10.5;
    [pp.title, pp.phone, pp.email].filter(Boolean).forEach(t => { doc.text(t, ML, yy); yy += 4.2; });
    doc.setDrawColor.apply(doc, C.line); doc.setLineWidth(0.25); doc.line(ML + CW / 2 + 2, cur.y + 22, ML + CW / 2 + 72, cur.y + 22);
    font(doc, 7.2, false, C.muted); doc.text(U.signature, ML + CW / 2 + 2, cur.y + 26);
    finishPages(doc, ctx, docTitle);
    doc.setProperties({ title: docTitle + ' ' + ctx.nrFull, subject: e.title || '', author: s.company.name || '', creator: EN ? 'Estimate calculator' : 'Sąmatų skaičiuoklė' });
    return doc;
  }

  // =============== VIDINĖ KALKULIACIJA ===============
  function internal(ctx) {
    const doc = mk();
    const { e, r, settings: s, fmt: f } = ctx;
    const T = r.totals, c = r.c;
    const cur = { y: 16 };
    drawLogo(doc, s, ML, 15, 62, 8);
    font(doc, 7.4, true, C.crit); spaced(doc, 'VIDINĖ KALKULIACIJA · KONFIDENCIALU', PW - MR, 17.5, 0.4, 'right');
    font(doc, 13, true, C.ink); doc.text('Nr. ' + ctx.nrFull, PW - MR, 24, { align: 'right' });
    font(doc, 8.2, false, C.muted); doc.text('Parengta ' + todayISO() + ' · Kainynas: ' + ctx.pbName, PW - MR, 29, { align: 'right' });
    font(doc, 16, true, C.ink);
    let y = 42; doc.splitTextToSize(e.title || typeName(ctx, r.p), CW).slice(0, 3).forEach(l => { doc.text(l, ML, y); y += 6.5; });
    font(doc, 9, false, C.muted);
    doc.splitTextToSize([e.client.name, e.object.address, typeName(ctx, r.p), ctx.D.STAGES[r.p.stage], (ctx.settings.policies[c.policy] || {}).name].filter(Boolean).join(' · '), CW).slice(0, 2).forEach(l => { doc.text(l, ML, y); y += 4.6; }); y += 1.4;
    const low = T.margin < c.minMarginPct - 1e-9;
    y = figures(doc, y, [['Savikaina', f.money0(T.C0), 11.5], ['Kaina be PVM', f.money0(T.price), 11.5, C.brand], ['Pelnas', f.money0(T.profit), 11.5, T.profit < 0 ? C.crit : C.ink], ['Marža', f.pct(T.margin), 11.5, low ? C.crit : C.brand], ['Antkainis', f.pct(T.markup), 11.5]], 19);
    cur.y = y + 7;
    // Patvirtinimas
    const apprTxt = low
      ? 'Marža ' + f.pct(T.margin) + ' žemiau minimalios ' + f.pct(c.minMarginPct) + '. ' + (c.approvedBy ? 'Patvirtino: ' + c.approvedBy + (c.approvedAt ? ', ' + c.approvedAt : '') + '.' : 'Reikalingas vadovo patvirtinimas.')
      : 'Marža atitinka politiką (minimali ' + f.pct(c.minMarginPct) + '). Mažiausia kaina ' + (Number.isFinite(T.minPrice) ? f.money0(T.minPrice) : '-') + ', galima nuolaida iki ' + f.pct(Math.max(0, T.maxDiscountPct)) + '.' + (c.approvedBy ? ' Patvirtino: ' + c.approvedBy + (c.approvedAt ? ', ' + c.approvedAt : '') + '.' : '');
    para(doc, cur, apprTxt, { size: 9, bold: true, color: low ? C.crit : C.brand, after: 3 });
    // Kainos sudarymas
    heading(doc, cur, 'Kainos sudarymas', 'EUR be PVM');
    const P = T.price || 1;
    const wf = [
      ['Tiesioginės statybos išlaidos', '', f.money(T.construction), f.pct(T.construction / P * 100)],
      ['Statybvietės įrengimas ir išlaikymas', '', f.money(T.site), f.pct(T.site / P * 100)],
      ['Projektavimas, tyrimai ir leidimai', '', f.money(T.design), f.pct(T.design / P * 100)],
      ['Savikaina', '', f.money(T.C0), f.pct(T.C0 / P * 100)],
      ['Pridėtinės išlaidos', f.pct(c.overheadPct, 2) + ' savikainos', f.money(T.overhead), f.pct(T.overhead / P * 100)],
      ['Rizikos rezervas', f.pct(T.riskPct, 2), f.money(T.risk), f.pct(T.risk / P * 100)],
      ['Kainų pokyčio rezervas', f.pct(T.escPct, 2) + (c.escMode === 'AUTO' ? ', ' + f.fmtN(T.monthsToMid, 1) + ' mėn. iki darbų vidurio' : ''), f.money(T.escalation), f.pct(T.escalation / P * 100)],
      ['Draudimas, garantijos, garantinis rezervas', f.pct(T.pp * 100, 2) + ' kainos', f.money(T.ppCost), f.pct(T.ppCost / P * 100)],
      ['Pelnas', c.profitMode === 'PRICE' ? 'tikslinė kaina' : (c.profitMode === 'MARKUP' ? 'antkainis ' : 'marža ') + f.pct(c.profitPct, 2) + (c.discountPct > 0 && c.profitMode !== 'PRICE' ? ', nuolaida ' + f.pct(c.discountPct, 2) : ''), f.money(T.profit), f.pct(T.margin)]
    ];
    at(doc, tableBase({
      startY: cur.y, head: [['Straipsnis', 'Pagrindas', 'Suma', 'Dalis']], body: wf,
      foot: [['Kaina be PVM', '', f.money(T.price), '100 %'], [c.vatMode === 'RC' ? 'PVM (atvirkštinis, užsakovo ' + f.money0(T.vatSelf) + ')' : 'PVM ' + f.pctT(c.vatPct), '', f.money(T.vat), ''], [c.vatMode === 'RC' ? 'Mokėtina suma' : 'Kaina su PVM', '', f.money(T.priceVat), '']],
      columnStyles: { 1: { textColor: C.muted, fontSize: 7.8 }, 2: { halign: 'right', cellWidth: 34 }, 3: { halign: 'right', cellWidth: 18 } },
      didParseCell: d => { if ((d.section === 'head' || d.section === 'foot') && d.column.index >= 2) d.cell.styles.halign = 'right'; if (d.section === 'body' && d.row.index === 3) d.cell.styles.fontStyle = 'bold'; }
    }));
    cur.y = doc.lastAutoTable.finalY + 8;
    // Rodikliai
    heading(doc, cur, 'Rodikliai');
    at(doc, tableBase({
      startY: cur.y, body: [
        ['Kaina už m² bendrojo ploto', f.money0(T.perM2), 'Savikaina už m²', f.money0(T.costPerM2)],
        ['Kaina už m³', f.money(T.perM3, 2), 'Maržinės pajamos', f.pct(T.contributionPct)],
        ['Mažiausia kaina (min. marža)', Number.isFinite(T.minPrice) ? f.money0(T.minPrice) : '-', 'Galima nuolaida iki', f.pct(Math.max(0, T.maxDiscountPct))],
        ['Darbo sąnaudos (normatyvai)', f.fmtN(T.laborHours) + ' val.', 'Statybos trukmė', f.fmtN(r.months, 1) + ' mėn., žiemos ' + f.fmtN(r.winterMonths, 1) + ' mėn.'],
        ['Rinkos orientyras', r.bench ? f.fmtN(r.bench[0]) + '-' + f.fmtN(r.bench[1]) + ' €/m²' : '-', 'Kainų koeficientas K', f.fmtN(T.K, 4)]
      ], columnStyles: { 0: { textColor: C.muted, cellWidth: 48 }, 1: { halign: 'right', cellWidth: 40 }, 2: { textColor: C.muted, cellWidth: 50 }, 3: { halign: 'right' } }
    }));
    cur.y = doc.lastAutoTable.finalY + 8;
    // Darbų grupės
    heading(doc, cur, 'Savikaina pagal darbų grupes', 'EUR be PVM');
    const secs = r.sections.filter(x => x.cost > 0);
    at(doc, tableBase({
      startY: cur.y, head: [['Darbų grupė', 'Darbas', 'Medžiagos', 'Mechanizmai', 'Subranga', 'Savikaina', 'Kaina']],
      body: secs.map(x => [x.name, f.money0(x.split.d), f.money0(x.split.m), f.money0(x.split.me), f.money0(x.split.s), f.money0(x.cost), f.money0(x.sale)]),
      foot: [['Iš viso', f.money0(T.split.d), f.money0(T.split.m), f.money0(T.split.me), f.money0(T.split.s), f.money0(T.C0), f.money0(T.price)]],
      styles: Object.assign(tableBase().styles, { fontSize: 7.8 }),
      didParseCell: d => { if (d.column.index >= 1) d.cell.styles.halign = 'right'; }
    }));
    cur.y = doc.lastAutoTable.finalY + 8;
    // Jautrumas
    if (ctx.sens) {
      heading(doc, cur, 'Jautrumo analizė', 'kai sutarties kaina fiksuota');
      at(doc, tableBase({
        startY: cur.y, head: [['Pabrangus 10 %', 'Savikaina', 'Pelnas*', 'Marža*', 'Kaina maržai išlaikyti']],
        body: ctx.sens.map(x => [x.name, '+' + f.money0(x.dCost), f.money0(x.dProfit), f.pct(x.marginAtPrice), '+' + f.money0(x.dPriceKeep)]),
        didParseCell: d => { if (d.column.index >= 1) d.cell.styles.halign = 'right'; }
      }));
      cur.y = doc.lastAutoTable.finalY + 3;
      para(doc, cur, '* jei sutarties kaina jau fiksuota ir pabrangimas nepadengiamas rezervais.', { size: 7.4, color: C.muted, after: 5 });
    }
    // Pinigų srautai
    if (ctx.cash) {
      const cf = ctx.cash;
      heading(doc, cur, 'Pinigų srautai', 'be PVM ir įmonės pridėtinių');
      para(doc, cur, (cf.peakNeed > 0 ? 'Didžiausias finansavimo poreikis ' + f.money0(cf.peakNeed) + ' (' + cf.peakLabel + ').' : 'Finansavimo poreikio nėra: avansas ir mokėjimai padengia išlaidas.') + ' Avansas ' + f.money0(cf.advance) + ', sulaikymas ' + f.money0(cf.retention) + ', projekto pinigų rezultatas ' + f.money0(cf.final) + '. Užsakovas moka po ' + c.payDays + ' d., tiekėjams mokama po ' + c.supDays + ' d.', { size: 8.4, after: 2 });
      at(doc, tableBase({
        startY: cur.y, head: [['Mėnuo', 'Atlikta darbų', 'Gauta', 'Išmokėta', 'Srautas', 'Likutis']],
        body: cf.rows.map(x => [x.label, f.money0(x.work), f.money0(x.receipt), f.money0(x.pay), f.money0(x.net), f.money0(x.cum)]),
        styles: Object.assign(tableBase().styles, { fontSize: 7.6 }),
        didParseCell: d => { if (d.column.index >= 1) d.cell.styles.halign = 'right'; if (d.section === 'body' && d.column.index === 5 && cf.rows[d.row.index] && cf.rows[d.row.index].cum < 0) d.cell.styles.textColor = C.crit; }
      }));
      cur.y = doc.lastAutoTable.finalY + 8;
    }
    // Patikra
    if (r.warnings.length) { heading(doc, cur, 'Patikra'); bullets(doc, cur, r.warnings.map(w => (w.lvl === 'crit' ? 'SVARBU: ' : '') + w.msg)); }
    // Parametrai
    heading(doc, cur, 'Objekto parametrai');
    at(doc, tableBase({ startY: cur.y, body: paramRows(ctx, r), columnStyles: { 0: { cellWidth: 52, textColor: C.muted } } }));
    cur.y = doc.lastAutoTable.finalY + 8;
    // Pozicijos
    doc.addPage(); cur.y = MT;
    heading(doc, cur, 'Pozicijos su savikaina', 'EUR be PVM');
    r.sections.forEach((sec, si) => {
      const ls = r.lines.filter(l => l.sec === sec.id && l.qty > 0);
      if (!ls.length) return;
      ensure(doc, cur, 22);
      at(doc, tableBase({
        startY: cur.y,
        head: [[{ content: (si + 1) + '. ' + sec.name, colSpan: 7, styles: { fillColor: C.soft, textColor: C.ink, fontSize: 8.2 } }], ['Kodas', 'Pavadinimas', 'Vnt.', 'Kiekis', 'Savik./vnt.', 'Savikaina', 'Kaina']],
        body: ls.map(l => [l.code + (l.overridden || l.manualUc ? ' *' : ''), l.name, l.unit, f.fmtN(l.qty, Math.abs(l.qty - Math.round(l.qty)) > 0.0001 ? 2 : 0), f.money(l.u.total), f.money0(l.total), f.money0(l.saleTotal)]),
        foot: [['', 'Iš viso', '', '', '', f.money0(sec.cost), f.money0(sec.lineSale)]],
        styles: Object.assign(tableBase().styles, { fontSize: 7.4 }),
        columnStyles: { 0: { cellWidth: 15 }, 2: { cellWidth: 12 }, 3: { halign: 'right', cellWidth: 17 }, 4: { halign: 'right', cellWidth: 22 }, 5: { halign: 'right', cellWidth: 23 }, 6: { halign: 'right', cellWidth: 23 } },
        didParseCell: d => { if ((d.section === 'head' && d.row.index === 1 || d.section === 'foot') && d.column.index >= 3) d.cell.styles.halign = 'right'; }
      }));
      cur.y = doc.lastAutoTable.finalY + 4;
    });
    para(doc, cur, '* kiekis arba vieneto kaina pakeisti rankiniu būdu.', { size: 7.6, color: C.muted, after: 4 });
    // Naudoti įkainiai
    const used = new Map();
    r.lines.filter(l => l.qty > 0).forEach(l => (l.u.parts || []).forEach(p => { if (!used.has(p.code)) used.set(p.code, p); }));
    if (used.size) {
      heading(doc, cur, 'Naudoti įkainiai', ctx.pbName);
      at(doc, tableBase({
        startY: cur.y, head: [['Kodas', 'Resursas', 'Vnt.', 'Kaina']],
        body: Array.from(used.values()).sort((a, b) => a.code.localeCompare(b.code)).map(p => [p.code, p.name, p.unit, f.money(p.price)]),
        styles: Object.assign(tableBase().styles, { fontSize: 7.4 }),
        columnStyles: { 0: { cellWidth: 24 }, 2: { cellWidth: 14 }, 3: { halign: 'right', cellWidth: 26 } },
        didParseCell: d => { if (d.section === 'head' && d.column.index === 3) d.cell.styles.halign = 'right'; }
      }));
    }
    finishPages(doc, ctx, 'Vidinė kalkuliacija');
    doc.setProperties({ title: 'Vidinė kalkuliacija ' + ctx.nrFull, author: s.company.name || '', creator: 'Sąmatų skaičiuoklė' });
    return doc;
  }

  function addMonthsYM(ym, add) {
    const m = /^(\d{4})-(\d{1,2})/.exec(String(ym || '')); if (!m) return '';
    const idx = (+m[1]) * 12 + (+m[2] - 1) + Math.floor(add || 0);
    return Math.floor(idx / 12) + '-' + String(idx % 12 + 1).padStart(2, '0');
  }
  function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function addDays(iso, n) { const d = new Date((iso || todayISO()) + 'T12:00:00'); d.setDate(d.getDate() + (+n || 0)); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  window.SqPDF = { client, internal };
})();

</script>
<script>
/* Sąmatų skaičiuoklė: naudotojo sąsaja. Duomenys saugomi tik šios naršyklės atmintyje (localStorage). */
(function () {
  'use strict';
  const D = window.SQ_DATA, E = window.SqEngine;
  const LS_KEY = 'eika-samatos-v1';
  let S = null;          // būsena
  let R = null;          // dabartinės sąmatos skaičiavimo rezultatas
  let saveTimer = null, lastSaved = null, saveError = false;

  // ---------------- pagalbinės ----------------
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = p => p + '-' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-5);
  const clone = o => JSON.parse(JSON.stringify(o));
  const EN = () => S && S.settings.numberFormat === 'EN';
  const fmtCache = {};
  function fmtN(x, dec) {
    if (!Number.isFinite(x)) return '-';
    dec = dec === undefined ? 0 : dec;
    const loc = EN() ? 'en-US' : 'lt-LT';
    const k = loc + dec;
    if (!fmtCache[k]) fmtCache[k] = new Intl.NumberFormat(loc, { minimumFractionDigits: dec, maximumFractionDigits: dec });
    return fmtCache[k].format(Math.abs(x) < 0.005 && dec <= 2 ? 0 : x);
  }
  const money = (x, dec) => EN() ? fmtN(x, dec === undefined ? 2 : dec) + '€' : fmtN(x, dec === undefined ? 2 : dec) + ' €';

  function renderRail() {
    const rail = $('#rail');

    $('#layout').classList.toggle('full', full);
    rail.classList.toggle('hidden', full);
    if (!R) { rail.innerHTML = ''; return; }
    const T = R.totals, b = R.bench, e = est();
    const low = T.margin < R.c.minMarginPct - 1e-9;
    let meter = '';
    if (b && T.perM2 > 0) {
      const lo = b[0] * 0.6, hi = b[1] * 1.4;
      const x = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
      meter = '<div class="meter" title="Rinkos orientyras ' + b[0] + '-' + b[1] + ' €/m²"><div class="band" style="left:' + x(b[0]) + '%;width:' + (x(b[1]) - x(b[0])) + '%"></div><div class="pin" style="left:' + x(T.perM2) + '%"></div></div>' +
        '<div class="meter-l"><span>Rinkos orientyras ' + fmtN(b[0]) + '-' + fmtN(b[1]) + ' €/m²</span><span>' + fmtN(T.perM2) + ' €/m²</span></div>';
    }
    const parts = [['Darbas', T.split.d, 'var(--c-d)'], ['Medžiagos', T.split.m, 'var(--c-m)'], ['Mechanizmai', T.split.me, 'var(--c-me)'], ['Subranga', T.split.s, 'var(--c-s)'], ['Pridėtinės ir rezervai', T.overhead + T.risk + T.escalation + T.ppCost, 'var(--c-o)'], ['Pelnas', Math.max(0, T.profit), 'var(--c-p)']];
    const tot = parts.reduce((a, p) => a + Math.max(0, p[1]), 0) || 1;
    const lastSent = (e && e.status !== 'DRAFT' && e.versions && e.versions.length) ? e.versions[e.versions.length - 1] : null;
    const extraW = lastSent && Math.abs(lastSent.totals.price - T.price) >= 1 ? [{ lvl: 'warn', msg: 'Kaina pasikeitė nuo paskutinės klientui pateiktos versijos (' + money0(lastSent.totals.price) + ' → ' + money0(T.price) + '). Palyginimas: Variantai ir versijos.' }] : [];
    const warns = extraW.concat(R.warnings).sort((a, b2) => ({ crit: 0, warn: 1, info: 2 }[a.lvl] - { crit: 0, warn: 1, info: 2 }[b2.lvl]));
    rail.innerHTML =
      '<section class="card sum-card"><div class="eyebrow">Kaina be PVM</div><div class="sum-price num">' + money0(T.price) + '</div>' +
      '<div class="sum-sub num">' + (R.c.vatMode === 'RC' ? 'Atvirkštinis PVM' + (T.vat > 0 ? ', mokėtina suma ' + money0(T.priceVat) : '') : 'Su PVM ' + money0(T.priceVat)) + ' · ' + fmtN(R.g.GFA) + ' m²</div>' +
      meter +
      '<dl class="kv"><dt>Marža</dt><dd><span class="margin-pill ' + (low ? 'low' : 'ok') + '">' + pct(T.margin) + '</span></dd>' +
      '<dt>Pelnas</dt><dd class="num">' + money0(T.profit) + '</dd>' +
      '<dt>Savikaina</dt><dd class="num">' + money0(T.C0) + '</dd>' +
      '<dt>Maržinės pajamos</dt><dd class="num">' + pct(T.contributionPct) + '</dd>' +
      '<dt>Galima nuolaida iki</dt><dd class="num">' + (T.maxDiscountPct > 0 ? pct(T.maxDiscountPct) : '0') + '</dd>' +
      '<dt>Statybos trukmė</dt><dd class="num">' + fmtN(R.months, 1) + ' mėn.</dd>' +
      '<dt>Kainynas</dt><dd style="font-weight:500;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(R.priceBook.name) + '">' + esc(R.priceBook.name) + '</dd></dl>' +
      '<div class="stack">' + parts.map(p => '<span style="width:' + (Math.max(0, p[1]) / tot * 100) + '%;background:' + p[2] + '"></span>').join('') + '</div>' +
      '<div class="legend">' + parts.map(p => '<span><i style="background:' + p[2] + '"></i>' + p[0] + '</span><span class="num">' + pct(Math.max(0, p[1]) / tot * 100, 0) + '</span>').join('') + '</div></section>' +
      (warns.length ? '<section class="card sum-card rail-extra"><div class="eyebrow" style="margin-bottom:10px">Patikra (' + warns.length + ')</div><div class="warns">' +
        warns.map(w => '<div class="warn ' + (w.lvl === 'crit' ? 'crit' : w.lvl === 'warn' ? 'warn-l' : '') + '">' + (w.lvl === 'info' ? ICON.info : ICON.alert) + '<span>' + esc(w.msg) + '</span></div>').join('') + '</div></section>' : '');

  function cashCard() {
    const cf = E.cashflow(R), rows = cf.rows;
    const W = 760, H = 210, pl = 64, pr = 14, pt = 14, pb = 30;
    const vals = rows.map(r => r.cum);
    let maxV = Math.max(0, ...vals), minV = Math.min(0, ...vals);
    if (maxV - minV < 1) maxV = minV + 1;
    const pad = (maxV - minV) * 0.08; maxV += pad; if (minV < 0) minV -= pad;
    const X = i => pl + (W - pl - pr) * (rows.length === 1 ? 0.5 : i / (rows.length - 1));
    const Y = v => pt + (H - pt - pb) * (maxV - v) / (maxV - minV);
    const y0 = Y(0);

  function snapshot(e, note) {

  function addVersion(e, note) {

  // ---------------- 6. Įkainiai ----------------

      '<input class="inp num" style="width:80px" id="idxPct" placeholder="+3" inputmode="decimal" aria-label="Indeksavimo procentas"><button class="btn" data-act="indexPb" data-id="' + ed.id + '">Taikyti %</button>' +
      '<button class="btn" data-act="exportPb" data-id="' + ed.id + '">' + ICON.dl + 'CSV</button><button class="btn" data-act="importPb" data-id="' + ed.id + '">' + ICON.up + 'Importuoti CSV</button></div>';

  // ---------------- 7. Sąmatos (projektai) ----------------
  const STATUS = { DRAFT: 'Juodraštis', SENT: 'Pateikta', WON: 'Laimėta', LOST: 'Nelaimėta' };
  function tabProjektai() {
    const q = (S.ui.pSearch || '').toLowerCase();
    const rows = S.estimates.slice().sort((a, b) => String(b.updated).localeCompare(String(a.updated))).filter(x => !q || (x.nr + ' ' + x.title + ' ' + (x.client.name || '') + ' ' + (x.object.address || '')).toLowerCase().indexOf(q) >= 0);
    const calc = rows.map(x => ({ x, r: E.compute(x, pbOf(x)) }));
    const agg = st => { const f = calc.filter(c => c.x.status === st); return { n: f.length, v: f.reduce((a, c) => a + c.r.totals.price, 0) }; };
    const sent = agg('SENT'), won = agg('WON'), lost = agg('LOST');
    const winRate = won.n + lost.n > 0 ? won.n / (won.n + lost.n) * 100 : null;
    const kp = '<div class="kpis">' + kpi('Sąmatų', fmtN(S.estimates.length), '') + kpi('Pateikta', money0(sent.v), fmtN(sent.n) + ' vnt.') + kpi('Laimėta', money0(won.v), fmtN(won.n) + ' vnt.') + kpi('Laimėjimo dalis', winRate === null ? '-' : pct(winRate, 0), 'Iš laimėtų ir nelaimėtų') + '</div>';
    const tbl = '<table class="t"><thead><tr><th>Nr.</th><th>Objektas</th><th>Užsakovas</th><th class="r">Plotas</th><th class="r">Kaina be PVM</th><th class="r nu">€/m²</th><th class="r">Marža</th><th>Būsena</th><th>Atnaujinta</th><th></th></tr></thead><tbody>' +
      calc.map(({ x, r }) => '<tr' + (x.id === S.currentId ? ' style="font-weight:600"' : '') + '><td class="num">' + esc(nrFull(x)) + '</td><td>' + esc(x.title || 'Be pavadinimo') + '<div class="hint">' + esc(D.TYPES[r.p.type].name) + (x.object.address ? ', ' + esc(x.object.address) : '') + '</div></td><td>' + esc(x.client.name || '') + '</td>' +
        '<td class="r num">' + fmtN(r.g.GFA) + ' m²</td><td class="r num">' + money0(r.totals.price) + '</td><td class="r num">' + fmtN(r.totals.perM2) + '</td><td class="r num">' + pct(r.totals.margin) + '</td>' +
        '<td><select class="inp" style="min-width:120px" aria-label="Būsena" data-status="' + x.id + '">' + Object.keys(STATUS).map(k => '<option value="' + k + '"' + (x.status === k ? ' selected' : '') + '>' + STATUS[k] + '</option>').join('') + '</select></td>' +
        '<td class="num muted">' + esc(String(x.updated || '').slice(0, 10)) + '</td>' +
        '<td><div class="row-tools">' + (x.id !== S.currentId ? '<button class="btn sm" data-act="open" data-id="' + x.id + '">Atidaryti</button>' : '<span class="badge ok">atidaryta</span>') +
        '<button class="icon-btn" data-act="dupEst" data-id="' + x.id + '" title="Kopijuoti kaip naują sąmatą">' + ICON.copy + '</button>' +
        '<button class="icon-btn" data-act="exportEst" data-id="' + x.id + '" title="Eksportuoti (JSON)">' + ICON.dl + '</button>' +
        (S.estimates.length > 1 ? '<button class="icon-btn" data-act="delEst" data-id="' + x.id + '" title="Ištrinti">' + ICON.trash + '</button>' : '') + '</div></td></tr>').join('') +
      (calc.length ? '' : '<tr><td colspan="10" class="empty">Nieko nerasta</td></tr>') + '</tbody></table>';
    return card('Suvestinė', kp) + card('Visos sąmatos', '<div class="tbl-wrap">' + tbl + '</div>', {
      tight: true, right: '<input class="inp search" aria-label="Paieška" placeholder="Paieška" data-ui="pSearch" value="' + esc(S.ui.pSearch || '') + '"><button class="btn" data-act="importEst">' + ICON.up + 'Importuoti</button><button class="btn primary" data-act="newEst">' + ICON.plus + 'Nauja sąmata</button>'
    });
  }

  // ---------------- atvaizdavimas ----------------
