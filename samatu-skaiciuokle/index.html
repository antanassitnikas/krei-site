      case 'logo': return pickFile('image/png,image/jpeg', null, file => loadLogo(file));
      case 'logoDel': S.settings.logo = ''; save(); renderAll(); return;
      case 'backup': download(JSON.stringify({ type: 'eika-samatos-backup', v: 1, exported: new Date().toISOString(), state: S }, null, 1), 'samatos-atsargine-kopija-' + todayISO() + '.json', 'application/json'); return;
      case 'restore': return pickFile('.json', txt => importJSON(txt, true));
      case 'resetDemo': { if (!confirm('Ištrinti visus duomenis šioje naršyklėje ir atkurti pradinius pavyzdžius? Prieš tai rekomenduojama atsisiųsti atsarginę kopiją.')) return; S = seed(); renderAll(); save(true); toast('Pradiniai duomenys atkurti'); return; }
      default: return;
    }
  }

  // ---------------- dialogai ----------------
  function showLoadWarning() {
    const d = openDlg('Dėmesio: duomenys', '<div class="warn crit">' + ICON.alert + '<span>' + esc(loadWarning) + '</span></div>',
      (corrupted ? '<button class="btn" id="lwDl">' + ICON.dl + 'Atsisiųsti pažeistus duomenis</button><button class="btn" id="lwUse">Pradėti iš naujo ir saugoti</button>' : '') + '<button class="btn primary" data-close2>Supratau</button>');
    d.querySelector('[data-close2]').onclick = () => d.close();
    if (corrupted) {
      $('#lwDl').onclick = () => download(corrupted.raw, 'samatos-pazeisti-duomenys.json', 'application/json');
      $('#lwUse').onclick = () => { if (!confirm('Pradėti su pradiniais duomenimis ir juos saugoti? Pažeisti duomenys lieka atskiroje naršyklės kopijoje.')) return; storageBlocked = false; save(true); d.close(); toast('Saugojimas įjungtas'); };
    }
  }
  function openDlg(title, body, foot) {
    const d = $('#dlg');
    d.innerHTML = '<div class="d-h"><h3>' + esc(title) + '</h3><span style="flex:1"></span><button class="icon-btn" data-close aria-label="Uždaryti" title="Uždaryti">✕</button></div><div class="d-b">' + body + '</div><div class="d-f">' + foot + '</div>';
    d.querySelector('[data-close]').onclick = () => d.close();
    if (!d.open) d.showModal();
    return d;
  }
  function newEstDialog() {
    const d = openDlg('Nauja sąmata', '<div class="grid g2"><div class="field spanall"><label>Pastato tipas</label><div class="types" id="ntTypes">' + Object.keys(D.TYPES).map((k, i) => '<button class="type-card" data-nt="' + k + '" aria-pressed="' + (i === 1) + '"><b>' + esc(D.TYPES[k].name) + '</b><span>' + D.TYPES[k].bench[0] + '-' + D.TYPES[k].bench[1] + ' €/m²</span></button>').join('') + '</div></div>' +
      '<div class="field"><label>Objekto pavadinimas</label><input class="inp" id="ntTitle" placeholder="pvz. Sandėlis su biurais"></div><div class="field"><label>Užsakovas</label><input class="inp" id="ntClient"></div>' +
      '<div class="field"><label>Ilgis, m</label><input class="inp num" id="ntL" value="' + inVal(96) + '" inputmode="decimal"></div><div class="field"><label>Plotis, m</label><input class="inp num" id="ntW" value="' + inVal(48) + '" inputmode="decimal"></div>' +
      '<div class="field"><label>Kainynas</label><select class="inp" id="ntPb">' + S.priceBooks.map(b => '<option value="' + b.id + '">' + esc(b.name) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>Užsakovo tipas</label><select class="inp" id="ntPol">' + Object.keys(S.settings.policies).map(k => '<option value="' + k + '">' + esc(S.settings.policies[k].name) + '</option>').join('') + '</select></div></div>',
      '<button class="btn" data-close2>Atšaukti</button><button class="btn primary" id="ntGo">Sukurti</button>');
    let type = 'LOG';
    $$('[data-nt]', d).forEach(b => b.onclick = () => { type = b.getAttribute('data-nt'); $$('[data-nt]', d).forEach(x => x.setAttribute('aria-pressed', x === b)); });
    d.querySelector('[data-close2]').onclick = () => d.close();
    $('#ntGo').onclick = () => {
      const n = newEstimate(S, type, { title: $('#ntTitle').value.trim() || D.TYPES[type].name, client: { name: $('#ntClient').value.trim() } });
      const L = parseNum($('#ntL').value), W = parseNum($('#ntW').value);
      if (Number.isFinite(L) && L > 0) n.p.L = L; if (Number.isFinite(W) && W > 0) n.p.W = W;
      const np = E.normParams(n.p); if (np.L !== n.p.L || np.W !== n.p.W) toast('Gabaritai pakoreguoti į leistinas ribas: ' + inVal(np.L, 2) + ' × ' + inVal(np.W, 2) + ' m');
      n.p.L = np.L; n.p.W = np.W;
      n.pbId = $('#ntPb').value; applyPolicy(n, $('#ntPol').value, S);
      S.estimates.push(n); S.currentId = n.id; S.ui.tab = 'objektas'; d.close(); renderAll(); save(); toast('Sukurta ' + nrFull(n));
    };
  }
  function pasteDialog() {
    const d = openDlg('Įklijuoti pozicijas iš Excel', '<div class="note">Nukopijuokite Excel stulpelius ir įklijuokite žemiau. Stulpelių tvarka: <b>Pavadinimas</b>, <b>Mato vnt.</b>, <b>Kiekis</b>, <b>Vieneto savikaina</b> (arba keturi stulpeliai: darbas, medžiagos, mechanizmai, subranga). Antraštės eilutė praleidžiama automatiškai.</div>' +
      '<div class="field" style="margin-top:12px"><label>Skyrius</label><select class="inp" id="psSec">' + D.SECTIONS.map(s => '<option value="' + s.id + '"' + (s.id === 'KT' ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('') + '</select></div>' +
      '<div class="field" style="margin-top:12px"><label>Duomenys</label><textarea class="inp" id="psTxt" rows="8" placeholder="Hidroizoliacija\tm²\t120\t18,50"></textarea></div><div id="psPrev" style="margin-top:12px"></div>',
      '<button class="btn" data-close2>Atšaukti</button><button class="btn primary" id="psGo" disabled>Pridėti</button>');
    d.querySelector('[data-close2]').onclick = () => d.close();
    let parsed = [];
    $('#psTxt').oninput = () => {
      parsed = parsePaste($('#psTxt').value);
      $('#psPrev').innerHTML = parsed.length ? '<table class="t"><thead><tr><th>Pavadinimas</th><th>Vnt.</th><th class="r">Kiekis</th><th class="r">Savikaina / vnt.</th></tr></thead><tbody>' + parsed.slice(0, 50).map(x => '<tr><td>' + esc(x.name) + '</td><td>' + esc(x.unit) + '</td><td class="r num">' + fmtN(x.q, 2) + '</td><td class="r num">' + money(x.d + x.m + x.me + x.s) + '</td></tr>').join('') + '</tbody></table><div class="hint">Atpažinta eilučių: ' + parsed.length + '</div>' : '<div class="hint">Neatpažinta nė vienos eilutės.</div>';
      $('#psGo').disabled = !parsed.length;
    };
    $('#psGo').onclick = () => { const sec = $('#psSec').value; parsed.forEach(x => est().custom.push(Object.assign({ id: uid('c'), sec }, x))); d.close(); refresh(true); toast('Pridėta eilučių: ' + parsed.length); };
  }
  function parsePaste(txt) {
    const out = [];
    txt.split(/\r?\n/).forEach(line => {
      if (!line.trim()) return;
      const cols = line.indexOf('\t') >= 0 ? line.split('\t') : line.split(';');
      if (cols.length < 3) return;
      const name = cols[0].trim(), unit = (cols[1] || '').trim() || 'vnt.', q = parseNum(cols[2]);
      if (!name || !Number.isFinite(q)) return;
      const nums = cols.slice(3).map(parseNum);
      let d = 0, m = 0, me = 0, s = 0;
      if (nums.length >= 4 && nums.slice(0, 4).every(Number.isFinite)) { d = nums[0]; m = nums[1]; me = nums[2]; s = nums[3]; }
      else if (nums.length && Number.isFinite(nums[0])) s = nums[0];
      out.push({ name, unit, q: Math.max(0, q), d: Math.max(0, d), m: Math.max(0, m), me: Math.max(0, me), s: Math.max(0, s) });
    });
    return out;
  }

  // ---------------- failai ----------------
  function asciiName(s) { return String(s).normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, ''); }
  function download(data, name, mime) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  function pickFile(accept, onText, onFile) {
    const f = $('#fileIn'); f.value = ''; f.accept = accept;
    f.onchange = () => { const file = f.files[0]; if (!file) return; if (onFile) return onFile(file); const r = new FileReader(); r.onload = () => onText(String(r.result)); r.readAsText(file, 'utf-8'); };
    f.click();
  }
  function loadLogo(file) {
    if (file.size > 5e6) return toast('Per didelis failas (daugiau nei 5 MB)');
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 600, sc = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.width * sc)); cv.height = Math.max(1, Math.round(img.height * sc));
        const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, cv.width, cv.height);
        S.settings.logo = cv.toDataURL('image/png'); save(); renderAll(); toast('Logotipas įkeltas');
      };
      img.onerror = () => toast('Nepavyko nuskaityti paveikslėlio');
      img.src = String(r.result);
    };
    r.readAsDataURL(file);
  }
  function csvCell(v) { const s = String(v === null || v === undefined ? '' : v); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function csvNum(x, dec) { if (!Number.isFinite(x)) return ''; const s = (Math.round(x * Math.pow(10, dec)) / Math.pow(10, dec)).toFixed(dec); return EN() ? s : s.replace('.', ','); }
  function exportCSV(e) {
    const sep = EN() ? ',' : ';';
    const head = ['Skyrius', 'Kodas', 'Pavadinimas', 'Mato vnt.', 'Kiekis', 'Darbas/vnt.', 'Medžiagos/vnt.', 'Mechanizmai/vnt.', 'Subranga/vnt.', 'Savikaina/vnt.', 'Savikaina', 'Kaina/vnt.', 'Suma', 'Pastaba'];
    const secName = id => (D.SECTIONS.find(s => s.id === id) || {}).name || id;
    const rows = [head.join(sep)];
    R.lines.filter(l => l.qty > 0).forEach(l => rows.push([secName(l.sec), l.code, l.name, l.unit, csvNum(l.qty, 3), csvNum(l.u.d, 2), csvNum(l.u.m, 2), csvNum(l.u.me, 2), csvNum(l.u.s, 2), csvNum(l.u.total, 2), csvNum(l.total, 2), csvNum(l.saleUnit, 2), csvNum(l.saleTotal, 2), l.note || ''].map(csvCell).join(sep)));
    rows.push(['', '', 'Savikaina iš viso', '', '', '', '', '', '', '', csvNum(R.totals.C0, 2), '', csvNum(R.totals.itemSaleSum, 2), ''].map(csvCell).join(sep));
    if (Math.abs(R.totals.itemRounding) >= 0.005) rows.push(['', '', 'Apvalinimas', '', '', '', '', '', '', '', '', '', csvNum(R.totals.itemRounding, 2), ''].map(csvCell).join(sep));
    rows.push(['', '', 'Kaina be PVM', '', '', '', '', '', '', '', '', '', csvNum(R.totals.price, 2), ''].map(csvCell).join(sep));
    download('﻿' + rows.join('\r\n'), 'samata-' + asciiName(nrFull(e)) + '.csv', 'text/csv;charset=utf-8');
    toast('CSV atsisiųstas');
  }
  function exportPbCSV(pb) {
    const sep = EN() ? ',' : ';';
    const rows = [['Kodas', 'Pavadinimas', 'Mato vnt.', 'Grupė', 'Kaina', 'Pastaba'].join(sep)];
    pb.resources.forEach(r => rows.push([r.code, r.name, r.unit, r.group, csvNum(r.price, 2), r.note || ''].map(csvCell).join(sep)));
    download('﻿' + rows.join('\r\n'), 'kainynas-' + asciiName(pb.name) + '.csv', 'text/csv;charset=utf-8');
  }
  function splitCSVLine(line, sep) {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true; else if (ch === sep) { out.push(cur); cur = ''; } else cur += ch;
    }
    out.push(cur); return out;
  }
  function importPbCSV(pb, txt) {
    txt = txt.replace(/^﻿/, '');
    const lines = txt.split(/\r?\n/).filter(l => l.trim());
    if (!lines.length) return toast('Tuščias failas');
    const cnt = ch => (lines[0].split(ch).length - 1);
    const sep = [['\t', cnt('\t')], [';', cnt(';')], [',', cnt(',')]].sort((a, b) => b[1] - a[1])[0][0];
    let upd = 0, add = 0, bad = 0;
    lines.forEach((l, i) => {
      const c = splitCSVLine(l, sep);
      if (i === 0 && /kodas/i.test(c[0])) return;
      const code = (c[0] || '').trim(); const price = parseNum(c[4] !== undefined ? c[4] : c[1]);
      if (!code) return;
      if (!SAFE_ID.test(code)) { bad++; return; }
      if (!Number.isFinite(price) || price < 0) { bad++; return; }
      const r = pb.resources.find(x => x.code === code);
      if (r) { r.price = price; if (c[5] !== undefined && c[5].trim()) r.note = c[5].trim(); upd++; }
      else if (c[1] && c[2]) { pb.resources.push({ code, name: c[1].trim(), unit: c[2].trim(), group: ['darbas', 'mechanizmai', 'medziagos', 'subranga'].includes((c[3] || '').trim()) ? c[3].trim() : 'subranga', price, note: (c[5] || '').trim() }); add++; }
      else bad++;
    });
    refresh(true); toast('Atnaujinta: ' + upd + ', pridėta: ' + add + (bad ? ', praleista: ' + bad : ''));
  }
  function importJSON(txt, full) {
    let o; try { o = JSON.parse(txt); } catch (e) { return toast('Netinkamas failas'); }
    if (o && o.type === 'eika-samatos-backup' && o.state) {
      let ns;
      try { ns = migrate(clone(o.state)); if (!ns.estimates.length) throw new Error('tuščia'); } catch (e) { return toast('Atsarginė kopija pažeista: duomenys nepakeisti'); }
      if (!confirm('Atkurti visus duomenis iš kopijos (' + String(o.exported || '').slice(0, 10) + ', sąmatų: ' + ns.estimates.length + ')? Dabartiniai duomenys bus pakeisti.')) return;
      S = ns; storageBlocked = false; renderAll(); save(true); toast('Duomenys atkurti'); return;
    }
    if (o && o.type === 'eika-samata' && o.estimate && typeof o.estimate === 'object' && o.estimate.p) {
      let test;
      try { test = migrate({ estimates: [clone(o.estimate)], priceBooks: o.priceBook && Array.isArray(o.priceBook.resources) ? [clone(o.priceBook)] : [E.defaultPriceBook()], settings: S.settings }); } catch (e) { return toast('Sąmatos failas pažeistas'); }
      const x = test.estimates[0]; x.id = uid('e');
      const pbIn = test.priceBooks[0];
      const ex = S.priceBooks.find(b => b.id === pbIn.id);
      if (!ex) S.priceBooks.push(pbIn);
      else if (JSON.stringify(ex.resources) !== JSON.stringify(pbIn.resources)) { pbIn.id = uid('pb'); pbIn.name += ' (importuotas)'; S.priceBooks.push(pbIn); x.pbId = pbIn.id; }
      if (!S.priceBooks.find(b => b.id === x.pbId)) x.pbId = (ex || pbIn).id;
      const same = S.estimates.filter(y => y.group === x.group);
      if (same.length) { const used = new Set(same.map(y => y.variant)); for (let i = 0; i < 26; i++) { const L = String.fromCharCode(65 + i); if (!used.has(L)) { x.variant = L; break; } } }
      S.estimates.push(x); S.currentId = x.id; renderAll(); save(); toast('Importuota ' + nrFull(x)); return;
    }
    if (full) return toast('Tai ne atsarginės kopijos failas');
    toast('Neatpažintas failo formatas');
  }

  // ---------------- PDF ----------------
  function fmtFor(lang) {
    if (lang !== 'EN') return { money, money0, fmtN, pct, pctT };
    const nf = {};
    const n = (x, dec) => { dec = dec === undefined ? 0 : dec; if (!Number.isFinite(x)) return '-'; if (!nf[dec]) nf[dec] = new Intl.NumberFormat('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }); return nf[dec].format(Math.abs(x) < 0.005 && dec <= 2 ? 0 : x); };
    const m = (x, dec) => (x < -0.004 ? '-' : '') + '€' + n(Math.abs(x), dec === undefined ? 2 : dec);
    return { money: m, money0: x => m(x, 0), fmtN: n, pct: (x, dec) => n(x, dec === undefined ? 1 : dec) + '%', pctT: x => n(x, trimDec(x)) + '%' };
  }
  function pdfCtx(e) {
    const r = e.id === S.currentId ? R : E.compute(e, pbOf(e));
    const vs = variantsOf(e).map(v => ({ v, r: v.id === e.id ? r : E.compute(v, pbOf(v)) }));
    const lang = e.offer.lang === 'EN' ? 'EN' : 'LT';
    const TX = lang === 'EN' ? Object.assign(defaultOfferEN(), e.offer.en || {}) : e.offer;
    const payment = (TX.payment || '').trim() || paymentText(e, r.c, lang);
    const exclusions = (TX.exclusions || []).concat(autoExclusions(r, lang).filter(x => !(TX.exclusions || []).includes(x)));
    const texts = { objTitle: lang === 'EN' ? (TX.objTitle || '').trim() : '', title: TX.title, intro: TX.intro, assumptions: TX.assumptions || [], exclusions, payment, warranty: TX.warranty, notes: TX.notes };
    return { e, r, vs, settings: S.settings, payment, exclusions, texts, lang, nrFull: nrFull(e), fmt: fmtFor(lang), sens: null, D, pbName: pbOf(e).name };
  }
  function pdfClient() {
    const e = est();
    if (!window.SqPDF) return toast('PDF modulis neįkeltas');
    if (!(S.settings.company.name || '').trim() && !confirm('Neužpildyti įmonės rekvizitai (Nustatymai): PDF bus be rangovo duomenų. Tęsti?')) return;
    const validTo = addDaysISO(e.offer.date, e.offer.validityDays);
    if (validTo < todayISO() && confirm('Pasiūlymo data ' + e.offer.date + ' (galioja iki ' + validTo + ') jau praėjusi. Atnaujinti datą į šiandienos (' + todayISO() + ')?')) { e.offer.date = todayISO(); save(); }
    if (R.totals.margin < R.c.minMarginPct - 1e-9 && !(R.c.approvedBy || '').trim()) {
      if (!confirm('Marža ' + pct(R.totals.margin) + ' žemiau minimalios (' + pct(R.c.minMarginPct) + ') ir pasiūlymas nepatvirtintas. Vis tiek generuoti PDF klientui?')) return;
    }
    try { const doc = window.SqPDF.client(pdfCtx(e)); download(doc.output('blob'), (e.offer.lang === 'EN' ? 'Offer-' : 'Pasiulymas-') + asciiName(nrFull(e)) + '.pdf', 'application/pdf'); if (e.status === 'DRAFT') e.status = 'SENT'; addVersion(e, 'PDF klientui ' + todayISO()); save(); if (S.ui.tab === 'variantai') renderMain(); toast('PDF atsisiųstas, versija užfiksuota' + (e.status === 'SENT' ? ', būsena: Pateikta' : '')); }
    catch (err) { console.error(err); toast('Nepavyko sugeneruoti PDF: ' + err.message); }
  }
  function pdfInternal() {
    const e = est();
    if (!window.SqPDF) return toast('PDF modulis neįkeltas');
    try { const ctx = pdfCtx(e); ctx.lang = 'LT'; ctx.fmt = fmtFor('LT'); ctx.sens = E.sensitivity(e, pbOf(e), 10); ctx.cash = E.cashflow(ctx.r); const doc = window.SqPDF.internal(ctx); download(doc.output('blob'), 'Kalkuliacija-' + asciiName(nrFull(e)) + '.pdf', 'application/pdf'); toast('Vidinė kalkuliacija atsisiųsta'); }
    catch (err) { console.error(err); toast('Nepavyko sugeneruoti PDF: ' + err.message); }
  }
  let prevTimer = null, prevUrl = null;
  function schedulePreview() { clearTimeout(prevTimer); prevTimer = setTimeout(() => previewPDF(false), 450); }
  function previewPDF(explicit) {
    const fr = $('#pdfFrame'); if (!fr || !window.SqPDF) return;
    try {
      const doc = window.SqPDF.client(pdfCtx(est()));
      if (prevUrl) URL.revokeObjectURL(prevUrl);
      prevUrl = URL.createObjectURL(doc.output('blob'));
      fr.src = prevUrl + '#view=FitH';
      if (explicit) toast('Peržiūra atnaujinta');
    } catch (err) { console.error(err); if (explicit) toast('Nepavyko: ' + err.message); }
  }

  // ---------------- paleidimas ----------------
  function init() {
    S = load();
    renderShell();
    bindEvents();
    renderAll();
    if (loadWarning) showLoadWarning(); else save(true);
    window.__eika = { get state() { return S; }, get result() { return R; }, recompute, renderAll, parseNum, E, D };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
