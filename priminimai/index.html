<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>krei priminimai</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url(/fonts/inter-400.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;font-display:swap;src:url(/fonts/inter-600.woff2) format('woff2')}
:root{--paper:#FBFAF8;--ink:#18181b;--muted:#71717a;--ember:#c15f3c;--ok:#15803d;--err:#b91c1c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif;padding:16px}
.card{max-width:440px;width:100%;background:#fff;border:1px solid #e7e5e4;border-radius:14px;padding:28px 24px;text-align:center}
.brand{color:var(--ember);font-weight:600;letter-spacing:.02em;margin-bottom:18px}
.msg{font-size:18px;line-height:1.5}
.msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
.hint{color:var(--muted);font-size:13px;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <div class="brand">krei · priminimai</div>
  <div id="msg" class="msg">Vykdoma…</div>
  <div class="hint" id="hint"></div>
</div>
<script>
// Relays approve/skip links to the owner's Apps Script web app. Calls it without cookies,
// so Google's multi-account /u/N redirect can't break it.
(function () {
  var q = new URLSearchParams(location.search);
  var s = q.get('s'), msg = document.getElementById('msg'), hint = document.getElementById('hint');
  if (!s || !/^AKfy[\w-]+$/.test(s)) { msg.textContent = 'Neteisinga nuoroda.'; msg.className = 'msg err'; return; }
  var p = new URLSearchParams();
  ['a', 't', 'k'].forEach(function (n) { if (q.get(n)) p.set(n, q.get(n)); });
  p.set('fmt', 'json');
  fetch('https://script.google.com/macros/s/' + s + '/exec?' + p.toString(), { credentials: 'omit' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      msg.textContent = d.msg || 'Atlikta.'; msg.className = 'msg ' + (d.ok ? 'ok' : 'err');
      if (d.ok) hint.textContent = 'Šį langą galite uždaryti.';
    })
    .catch(function () {
      msg.textContent = 'Nepavyko susisiekti su sistema. Bandykite dar kartą po minutės.'; msg.className = 'msg err';
    });
})();
</script>
</body>
</html>
