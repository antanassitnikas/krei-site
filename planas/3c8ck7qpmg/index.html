<body>
<main class="card" id="gate">
  <p class="brand">kre<i>i</i></p>
  <p class="k">Planas</p>
  <h1>Planas jūsų įmonei</h1>
  <p>Atidarykite nuorodą iš laiško. Jei puslapis neatsidarė, įveskite slaptažodį, kurį gavote kartu su nuoroda.</p>
